<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第6單元含零乘法審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:#fff;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}textarea{display:block;width:95%;min-height:5em}label{display:block;margin-top:8px}summary{cursor:pointer;color:#184f70;min-height:42px;font-weight:bold}.grid{border-collapse:collapse;margin:8px 0;max-width:100%;table-layout:fixed}.grid th,.grid td{border:1px solid #888;text-align:center;padding:3px}.grid th:first-child{width:5.8em}.grid input{box-sizing:border-box;width:2.7em;max-width:100%;padding:5px;text-align:center}.grid caption{text-align:left;font-weight:bold}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,.group-section,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.paper{border-collapse:collapse;margin:3mm 0}.paper th,.paper td{border:1px solid #000;width:13mm;height:8mm;text-align:center}.paper th:first-child{width:24mm}.notes{height:25mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第6單元：被乘數含0的乘法</h1><section class="controls"><strong>公開審查稿：4題來源候選，屬同類練習；不是完整教材或精熟測驗。</strong><p>依題意在紙上圈出被乘數的0，記錄每組的量，並完成一列乘法直式。按鈕只檢查積；組數、位值、交換、連線、提示及實物活動由成人核對。第一題原題允許成人示範第一步，不能視為獨立測量。重新整理清除作答；列印為空白卷。教育、手機及列印尚待確認。</p><label><input type="checkbox" id="showKey">顯示家長答案頁</label></section><p class="print-only">公開審查稿：4題來源候選，非完整教材或精熟。請依題意使用實物並由成人核對位值、直式及提示。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>積正確仍須核對每組數量、位值、交換、說明及實物操作；第1題允許示範第一步，需記錄提示。</p></section></main><script>
const items=[{"id":"PG03","facet":"zero","prompt":"每組508，共6組。先圈被乘數的0所在位，再完成一列積直式，指出這位如何接收其他位的進位。成人可示範第一步，但記提示後讓孩子完成。","answer":"508×6＝3048","operands":[508,6],"product":3048,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_manual_review":true,"notes":"原題允許成人示範，應記錄協助；不是獨立測量。","parent_steps":"個位：8×6＝48，寫8，向十位進4；十位：0×6＋進位4＝4，寫4；百位：5×6＝30，寫0，向千位進3；將進位3寫在千位。"},{"id":"PA03","facet":"zero","prompt":"每組609，共4組。先圈被乘數的0所在位，再完成一列積直式，指出這位如何接收其他位的進位。","answer":"609×4＝2436","operands":[609,4],"product":2436,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_manual_review":true,"notes":"位值、圈選、解釋及操作需成人核對。","parent_steps":"個位：9×4＝36，寫6，向十位進3；十位：0×4＋進位3＝3，寫3；百位：6×4＝24，寫4，向千位進2；將進位2寫在千位。"},{"id":"PB03","facet":"zero","prompt":"每組702，共6組。先圈被乘數的0所在位，再完成一列積直式，指出這位如何接收其他位的進位。把材料記錄翻譯為直式，圈兩份作品同一位的量。","answer":"702×6＝4212","operands":[702,6],"product":4212,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_manual_review":true,"notes":"位值、圈選、解釋及操作需成人核對。","parent_steps":"個位：2×6＝12，寫2，向十位進1；十位：0×6＋進位1＝1，寫1；百位：7×6＝42，寫2，向千位進4；將進位4寫在千位。"},{"id":"PC03","facet":"zero","prompt":"每組406，共5組。先圈被乘數的0所在位，再完成一列積直式，指出這位如何接收其他位的進位。","answer":"406×5＝2030","operands":[406,5],"product":2030,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_manual_review":true,"notes":"位值、圈選、解釋及操作需成人核對。","parent_steps":"個位：6×5＝30，寫0，向十位進3；十位：0×5＋進位3＝3，寫3；百位：4×5＝20，寫0，向千位進2；將進位2寫在千位。"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function groupTable(q,i,paper=false){const places=['千','百','十','個'],rows=Array.from({length:q.operands[1]},(_,j)=>'第'+(j+1)+'組').concat('合起來');return '<table class="'+(paper?'paper':'grid')+'"><caption>第'+(i+1)+'題空白組數位值表</caption><thead><tr><th scope="col">記錄</th>'+places.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th scope="row">'+r+'</th>'+places.map(c=>'<td>'+(paper?'':'<input type="text" inputmode="numeric" maxlength="2" aria-label="第'+(i+1)+'題'+r+c+'位">')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>填寫積 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的積"></label><button type="button">檢查積</button><p class="feedback" role="status"></p><details class="group-section"><summary>展開空白組數位值表</summary><p>各組和合起來的記錄供成人核對；交換、連線及實物操作另行確認。</p>'+groupTable(q,i)+'</details><div class="print-only">'+groupTable(q,i,true)+'<div>一列直式及說明：</div><div class="notes"></div></div><label>記錄直式、交換與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範第一步</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>協助情況由成人填寫，僅保留本頁，重新整理清除；不能單憑選項判定獨立作答。位值、直式、說明和實物操作需成人核對。</p></article>').join('');
document.querySelectorAll('article').forEach((el,i)=>{const input=el.querySelector('input'),feedback=el.querySelector('.feedback');input.oninput=()=>{feedback.textContent=''};el.querySelector('button').onclick=()=>{const s=input.value.trim();feedback.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].product?'積正確；其他要求仍請成人核對。':'積需要再檢查；請檢視每一位。'}});
document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'；每組'+q.operands[0]+'，共'+q.operands[1]+'組。'+(q.id==='PG03'?'原題可示範第一步，請記錄提示。':'')+'<br>'+esc(q.parent_steps)+'<br>被乘數中的0請依原題圈選並由成人核對。'+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
