<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第 2 單元：位值交換審查稿</title><style>
:root{color-scheme:light dark;--bg:#f4f2ec;--fg:#1c2330;--card:#fff;--line:#d6d0c2;--muted:#515a64;--accent:#2d5b86}@media(prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e7e4dc;--card:#1c212a;--line:#3b434f;--muted:#bdc6ce;--accent:#8db8e0}}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.65 'Microsoft JhengHei',sans-serif}.wrap{max-width:880px;margin:auto}h1{font-size:22px}h2{font-size:18px}.panel,.paper{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}.note{color:var(--muted);font-size:14px}.question{padding:16px 0;border-bottom:1px solid var(--line);break-inside:avoid}.state{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.piece{border:1px solid var(--line);padding:6px 10px;border-radius:6px}.icons{display:flex;flex-wrap:wrap;gap:2px;max-width:100%;margin-top:5px}.ten-thousand{display:inline-block;background:#fff;color:#111;border:1px solid #222;padding:4px}.icons svg{background:#fff;border:1px solid #ddd;flex:none}.actions{display:flex;flex-wrap:wrap;gap:7px}button,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px;min-height:42px}button{cursor:pointer}textarea{width:100%;min-height:4em;resize:vertical}.feedback{min-height:1.5em;font-weight:bold}.answer{color:var(--muted)}.answer-page{break-before:page}[hidden]{display:none!important}@media print{body{background:white;color:black}.controls,.actions,.feedback{display:none!important}.panel,.paper{border:0;padding:0}.question{border-bottom:1px solid #888}.question .answer{display:none!important}.answer{color:black}}
</style></head><body><main class="wrap"><h1>數學自動學習系統</h1><p class="note">三年級第 2 單元：位值換算與數量表示</p><section class="panel controls"><strong>審查稿：目前僅有 8 項位值交換候選，並非本單元完整教材或精熟測驗。</strong><p>按相鄰位值的交換按鈕，觀察各種積木件數，並自行計算總量。此頁提供數位示意；真實材料、口述及作答仍須成人依題目確認，未完成專業審查。</p><label><input type="checkbox" id="showAnswer"> 顯示家長參考答案</label> <label><input type="checkbox" id="showKey"> 顯示家長答案頁（列印附頁）</label>　<a href="./g3-u01-review-20261104.html">回三年級第 1 單元審查稿</a></section><div id="sheet"></div></main><script>
const items=[{"id":"G3-U02-SOURCE-C03","source_id":"C03","prompt":"用真實材料把1個千換百，再把其中1個百換十。記每次總量。","answer":"10百；9百10十；總量一直是1000","initial":[0,1,0,0,0],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-PG03","source_id":"PG03","prompt":"擺出6174，只把1個千換成百，再只把1個十換成一。記交換前後各種件數，說總量是否改變。","answer":"5千、11百、6十、14一；總量6174","initial":[0,6,1,7,4],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-PA03","source_id":"PA03","prompt":"擺出8541，只把1個千換成百，再只把1個十換成一。記交換前後各種件數，說總量是否改變。","answer":"7千、15百、3十、11一；總量8541","initial":[0,8,5,4,1],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-PB03","source_id":"PB03","prompt":"擺出6941，只把1個千換成百，再只把1個十換成一。記交換前後各種件數，說總量是否改變。","answer":"5千、19百、3十、11一；總量6941","initial":[0,6,9,4,1],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-PC03","source_id":"PC03","prompt":"擺出7284，只把1個千換成百，再只把1個十換成一。記交換前後各種件數，說總量是否改變。","answer":"6千、12百、7十、14一；總量7284","initial":[0,7,2,8,4],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-R03","source_id":"R03","prompt":"有人把2千換成20百後說總量變多。實際換並記換前後總量。","answer":"兩次均2000","initial":[0,2,0,0,0],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-F03","source_id":"F03","prompt":"另備4千2百，把其中2千換百，再換回1千，記每次配置。","answer":"2千22百，再3千12百；總量4200","original_answer":"先42百，再1千32百；總量4200","revision":"依題目指定只換其中2千及換回1千修正，待教育審查。","initial":[0,4,2,0,0],"code":["N-3-1"],"manual_required":true},{"id":"G3-U02-SOURCE-X03","source_id":"X03","prompt":"把9千9百9十10一換成各位0到9件，記交換到一萬為止的每一步。","answer":"9千9百10十0一；9千10百0十0一；10千；10000；10千可換成1萬","original_answer":"9千9百10十0一；9千10百0十0一；10千；10000","revision":"補明10千換成1萬以使用五欄正規表示，待教育審查。","initial":[0,9,9,9,10],"code":["N-3-1"],"manual_required":true}];const model=(()=>{'use strict';
// Array order: ten-thousands, thousands, hundreds, tens, ones. Intermediate counts may exceed 9.
function valid(a){return Array.isArray(a)&&a.length===5&&a.every(n=>Number.isInteger(n)&&n>=0&&n<=99)}
function total(a){if(!valid(a))throw Error('invalid pieces');return a.reduce((s,n,i)=>s+n*[10000,1000,100,10,1][i],0)}
function exchange(a,index,direction){if(!valid(a)||!Number.isInteger(index)||index<0||index>3||![-1,1].includes(direction))throw Error('invalid input');let b=a.slice();if(direction===1){if(b[index]<1||b[index+1]>89)return null;b[index]--;b[index+1]+=10}else{if(b[index+1]<10||b[index]>=99)return null;b[index]++;b[index+1]-=10}if(total(a)!==total(b))throw Error('total changed');return b}

return {valid,total,exchange}})();
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blockIcon(i){let grid='<rect x="0" y="0" width="20" height="20" fill="white" stroke="black" stroke-width=".6"/>'+Array.from({length:9},(_,j)=>'<path d="M'+((j+1)*2)+' 0v20M0 '+((j+1)*2)+'h20" stroke="black" stroke-width=".25"/>').join('');if(i===0)return '<svg width="58" height="58" viewBox="0 0 60 60" aria-hidden="true">'+Array.from({length:10},(_,j)=>'<g transform="translate('+(j*3)+','+(j*3)+')">'+grid+'</g>').join('')+'</svg>';if(i===1)return '<svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true">'+grid+'</svg>';if(i===2)return '<svg width="12" height="30" viewBox="0 0 4 20" aria-hidden="true"><rect x="1" y="0" width="2" height="20" fill="white" stroke="black" stroke-width=".4"/>'+Array.from({length:9},(_,j)=>'<path d="M1 '+((j+1)*2)+'h2" stroke="black" stroke-width=".3"/>').join('')+'</svg>';return '<svg width="10" height="10" viewBox="0 0 2 2" aria-hidden="true"><rect width="2" height="2" fill="black"/></svg>'}

function card(q,i){return `<article class="question"><strong>${i+1}. </strong><span>${esc(q.prompt)}</span><p class="note">先自行取出題目要求的材料，再使用按鈕交換；每次只交換相鄰一階。</p><div class="state" aria-label="目前材料"></div><div class="actions">${['萬','千','百','十','個'].map((name,j)=>'<button type="button" data-piece="'+j+'" data-delta="1">取出 1 '+name+'</button><button type="button" data-piece="'+j+'" data-delta="-1">放回 1 '+name+'</button>').join('')}</div><div class="actions">${['萬','千','百','十'].map((x,j)=>'<button type="button" data-index="'+j+'" data-direction="1">1'+x+' 換 10'+['千','百','十','個'][j]+'</button><button type="button" data-index="'+j+'" data-direction="-1">10'+['千','百','十','個'][j]+' 換 1'+x+'</button>').join('')}<button type="button" class="reset">清空材料</button><button type="button" class="save-step">記錄目前材料</button><button type="button" class="clear-steps">清除步驟紀錄</button></div><ol class="step-log" aria-label="已記錄的操作步驟"></ol><p class="feedback" role="status"></p><label>記錄你的步驟及理由<textarea></textarea></label><p class="answer" hidden>家長參考：${esc(q.answer)}；請核對每一步操作及說明。</p></article>`}
$('#sheet').innerHTML='<section class="paper"><h2>位值交換練習候選</h2>'+items.map(card).join('')+'</section><section id="answerPage" class="paper answer-page" hidden><h2>家長答案：位值交換</h2>'+items.map((q,i)=>'<p>'+(i+1)+'. '+esc(q.answer)+'</p>').join('')+'</section>';
document.querySelectorAll('.question').forEach((el,i)=>{let original=[0,0,0,0,0],state=original.slice(),steps=[],feedback=el.querySelector('.feedback');function render(){el.querySelector('.state').innerHTML=['萬','千','百','十','個'].map((name,j)=>'<span class="piece">'+name+'：'+state[j]+' 件 <span class="icons" aria-hidden="true">'+(j===0?'<span class="ten-thousand">1萬＝10千</span>'.repeat(state[j]):blockIcon(j-1).repeat(state[j]))+'</span></span>').join('')}el.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{let j=Number(b.dataset.piece),next=state.slice();next[j]+=Number(b.dataset.delta);if(!model.valid(next)||model.total(next)>10000){feedback.textContent='材料不足或數量超出一萬範圍。';return}state=next;feedback.textContent='已調整材料。';render()});el.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{let next=model.exchange(state,Number(b.dataset.index),Number(b.dataset.direction));if(!next){feedback.textContent='材料不足，或交換後件數超過此示意工具範圍。';return}state=next;feedback.textContent='已完成交換，請自行比較總量。';render()});el.querySelector('.reset').onclick=()=>{state=original.slice();feedback.textContent='已清空材料，步驟紀錄保留。';render()};el.querySelector('.save-step').onclick=()=>{if(steps.length>=30){feedback.textContent='最多記錄30步。';return}steps.push(state.slice());el.querySelector('.step-log').innerHTML=steps.map(a=>'<li>'+['萬','千','百','十','個'].map((x,j)=>x+' '+a[j]+' 件').join('，')+'</li>').join('');feedback.textContent='已記錄目前材料。'};el.querySelector('.clear-steps').onclick=()=>{steps=[];el.querySelector('.step-log').innerHTML='';feedback.textContent='已清除步驟紀錄。'};render()});
$('#showAnswer').onchange=()=>document.querySelectorAll('.answer').forEach(x=>x.hidden=!$('#showAnswer').checked);$('#showKey').onchange=()=>$('#answerPage').hidden=!$('#showKey').checked;
</script></body></html>
