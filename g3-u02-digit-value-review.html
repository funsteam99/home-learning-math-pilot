<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第 2 單元：位值交換審查稿</title><style>
:root{color-scheme:light dark;--bg:#f4f2ec;--fg:#1c2330;--card:#fff;--line:#d6d0c2;--muted:#515a64;--accent:#2d5b86}@media(prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e7e4dc;--card:#1c212a;--line:#3b434f;--muted:#bdc6ce;--accent:#8db8e0}}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.65 'Microsoft JhengHei',sans-serif}.wrap{max-width:880px;margin:auto}h1{font-size:22px}h2{font-size:18px}.panel,.paper{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}.note{color:var(--muted);font-size:14px}.question{padding:16px 0;border-bottom:1px solid var(--line);break-inside:avoid}.state,.given-state{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.piece{border:1px solid var(--line);padding:6px 10px;border-radius:6px}.icons{display:flex;flex-wrap:wrap;gap:2px;max-width:100%;margin-top:5px}.ten-thousand{display:inline-block;background:#fff;color:#111;border:1px solid #222;padding:4px}.icons svg{background:#fff;border:1px solid #ddd;flex:none}.actions{display:flex;flex-wrap:wrap;gap:7px}button,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px;min-height:42px}button{cursor:pointer}textarea{width:100%;min-height:4em;resize:vertical}.feedback{min-height:1.5em;font-weight:bold}.answer{color:var(--muted)}.answer-page{break-before:page}[hidden]{display:none!important}@media print{body{background:white;color:black}.controls,.actions,.feedback{display:none!important}.panel,.paper{border:0;padding:0}.question{border-bottom:1px solid #888}.question .answer{display:none!important}.answer{color:black}}
</style></head><body><main class="wrap"><h1>數學自動學習系統</h1><p class="note">三年級第 2 單元：位值換算與數量表示</p><section class="panel controls"><strong>批次製備審查稿：12題為百位與十條數量錯誤辨識的變式，不是原教材原題、完整教材或獨立精熟。</strong><p>按相鄰位值的交換按鈕，觀察各種積木件數，並自行計算總量。此頁提供數位示意；真實材料、口述及作答仍須成人依題目確認，未完成專業審查。重新整理頁面後，材料與步驟紀錄不保留。</p><label><input type="checkbox" id="showAnswer"> 顯示家長參考答案</label> <label><input type="checkbox" id="showKey"> 顯示家長答案頁（列印附頁）</label>　<a href="./g3-u01-review-20261104.html">回三年級第 1 單元審查稿</a></section><div id="sheet"></div></main><script>
const items=[{"id":"G3-U02-DIGIT-01","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,1,3,1,3],"digit":3,"wrong_tens":3,"prompt":"標籤1313中百位的3，和紀錄的3條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的3是3百，等於300；3條十條是30。改成3個百片，或30條十條。"},{"id":"G3-U02-DIGIT-02","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,6,1,4,0],"digit":1,"wrong_tens":1,"prompt":"標籤6140中百位的1，和紀錄的1條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的1是1百，等於100；1條十條是10。改成1個百片，或10條十條。"},{"id":"G3-U02-DIGIT-03","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,2,8,7,7],"digit":8,"wrong_tens":8,"prompt":"標籤2877中百位的8，和紀錄的8條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的8是8百，等於800；8條十條是80。改成8個百片，或80條十條。"},{"id":"G3-U02-DIGIT-04","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,7,6,0,4],"digit":6,"wrong_tens":6,"prompt":"標籤7604中百位的6，和紀錄的6條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的6是6百，等於600；6條十條是60。改成6個百片，或60條十條。"},{"id":"G3-U02-DIGIT-05","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,3,4,3,1],"digit":4,"wrong_tens":4,"prompt":"標籤3431中百位的4，和紀錄的4條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的4是4百，等於400；4條十條是40。改成4個百片，或40條十條。"},{"id":"G3-U02-DIGIT-06","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,8,2,6,8],"digit":2,"wrong_tens":2,"prompt":"標籤8268中百位的2，和紀錄的2條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的2是2百，等於200；2條十條是20。改成2個百片，或20條十條。"},{"id":"G3-U02-DIGIT-07","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,4,9,9,5],"digit":9,"wrong_tens":9,"prompt":"標籤4995中百位的9，和紀錄的9條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的9是9百，等於900；9條十條是90。改成9個百片，或90條十條。"},{"id":"G3-U02-DIGIT-08","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,9,7,2,2],"digit":7,"wrong_tens":7,"prompt":"標籤9722中百位的7，和紀錄的7條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的7是7百，等於700；7條十條是70。改成7個百片，或70條十條。"},{"id":"G3-U02-DIGIT-09","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,5,5,5,9],"digit":5,"wrong_tens":5,"prompt":"標籤5559中百位的5，和紀錄的5條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的5是5百，等於500；5條十條是50。改成5個百片，或50條十條。"},{"id":"G3-U02-DIGIT-10","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,1,3,8,6],"digit":3,"wrong_tens":3,"prompt":"標籤1386中百位的3，和紀錄的3條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的3是3百，等於300；3條十條是30。改成3個百片，或30條十條。"},{"id":"G3-U02-DIGIT-11","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,2,8,4,0],"digit":8,"wrong_tens":8,"prompt":"標籤2840中百位的8，和紀錄的8條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的8是8百，等於800；8條十條是80。改成8個百片，或80條十條。"},{"id":"G3-U02-DIGIT-12","pattern":"digit_value","pattern_source_id":"X01","code":["N-3-1"],"manual_required":true,"initial":[0,7,6,7,7],"digit":6,"wrong_tens":6,"prompt":"標籤7677中百位的6，和紀錄的6條十條是否同量？用位值說明並改正紀錄。","answer":"不同量：百位的6是6百，等於600；6條十條是60。改成6個百片，或60條十條。"}];const model=(()=>{'use strict';
// Array order: ten-thousands, thousands, hundreds, tens, ones. Intermediate counts may exceed 9.
function valid(a){return Array.isArray(a)&&a.length===5&&a.every(n=>Number.isInteger(n)&&n>=0&&n<=99)}
function total(a){if(!valid(a))throw Error('invalid pieces');return a.reduce((s,n,i)=>s+n*[10000,1000,100,10,1][i],0)}
function exchange(a,index,direction){if(!valid(a)||!Number.isInteger(index)||index<0||index>3||![-1,1].includes(direction))throw Error('invalid input');let b=a.slice();if(direction===1){if(b[index]<1||b[index+1]>89)return null;b[index]--;b[index+1]+=10}else{if(b[index+1]<10||b[index]>=99)return null;b[index]++;b[index+1]-=10}if(total(a)!==total(b))throw Error('total changed');return b}

return {valid,total,exchange}})();
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blockIcon(i){let grid='<rect x="0" y="0" width="20" height="20" fill="white" stroke="black" stroke-width=".6"/>'+Array.from({length:9},(_,j)=>'<path d="M'+((j+1)*2)+' 0v20M0 '+((j+1)*2)+'h20" stroke="black" stroke-width=".25"/>').join('');if(i===0)return '<svg width="58" height="58" viewBox="0 0 60 60" aria-hidden="true">'+Array.from({length:10},(_,j)=>'<g transform="translate('+(j*3)+','+(j*3)+')">'+grid+'</g>').join('')+'</svg>';if(i===1)return '<svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true">'+grid+'</svg>';if(i===2)return '<svg width="12" height="30" viewBox="0 0 4 20" aria-hidden="true"><rect x="1" y="0" width="2" height="20" fill="white" stroke="black" stroke-width=".4"/>'+Array.from({length:9},(_,j)=>'<path d="M1 '+((j+1)*2)+'h2" stroke="black" stroke-width=".3"/>').join('')+'</svg>';return '<svg width="10" height="10" viewBox="0 0 2 2" aria-hidden="true"><rect width="2" height="2" fill="black"/></svg>'}

function given(q){if(q.pattern==='digit_value')return '<p>題目給的錯誤紀錄：'+q.wrong_tens+' 條十條</p><div class="icons" role="img" aria-label="'+q.wrong_tens+'條十條">'+blockIcon(2).repeat(q.wrong_tens)+'</div>';if(q.source_id==='X01')return '<p>題目給的記錄：6 條十條</p><div class="icons" role="img" aria-label="六條十條">'+blockIcon(2).repeat(6)+'</div>';if(q.source_id==='X02')return '<p>題目給的材料：</p><div class="given-state">'+[5,12,4,2].map((n,i)=>'<div class="piece">'+['千','百','十','個'][i]+'：'+n+' 件<div class="icons" aria-hidden="true">'+blockIcon(i).repeat(n)+'</div></div>').join('')+'</div>';if(q.source_id==='R02')return '<p>題目中的原寫法：<span class="piece">7006</span> 寫成 <span class="piece">76</span></p>';return ''}
function card(q,i){return `<article class="question"><strong>${i+1}. </strong><span>${esc(q.prompt)}</span>${given(q)}<p class="note">依題意自行取出材料；需要交換時，使用按鈕每次交換相鄰一階。</p><div class="state" aria-label="目前材料"></div><div class="actions">${['萬','千','百','十','個'].map((name,j)=>'<button type="button" data-piece="'+j+'" data-delta="1">取出 1 '+name+'</button><button type="button" data-piece="'+j+'" data-delta="-1">放回 1 '+name+'</button>').join('')}</div><div class="actions">${['萬','千','百','十'].map((x,j)=>'<button type="button" data-index="'+j+'" data-direction="1">1'+x+' 換 10'+['千','百','十','個'][j]+'</button><button type="button" data-index="'+j+'" data-direction="-1">10'+['千','百','十','個'][j]+' 換 1'+x+'</button>').join('')}<button type="button" class="reset">清空材料</button><button type="button" class="save-step">記錄目前材料</button><button type="button" class="clear-steps">清除步驟紀錄</button></div><ol class="step-log" aria-label="已記錄的操作步驟"></ol><p class="feedback" role="status"></p><label>記錄你的步驟及理由<textarea></textarea></label><p class="answer" hidden>家長參考：${esc(q.answer)}；請核對每一步操作及說明。</p></article>`}
$('#sheet').innerHTML='<section class="paper"><h2>百位與十條的比較：12題候選</h2>'+items.map(card).join('')+'</section><section id="answerPage" class="paper answer-page" hidden><h2>家長答案：位值交換</h2>'+items.map((q,i)=>'<p>'+(i+1)+'. '+esc(q.answer)+'</p>').join('')+'</section>';
document.querySelectorAll('.question').forEach((el,i)=>{let original=[0,0,0,0,0],state=original.slice(),steps=[],feedback=el.querySelector('.feedback');function render(){el.querySelector('.state[aria-label="目前材料"]').innerHTML=['萬','千','百','十','個'].map((name,j)=>'<span class="piece">'+name+'：'+state[j]+' 件 <span class="icons" aria-hidden="true">'+(j===0?'<span class="ten-thousand">1萬＝10千</span>'.repeat(state[j]):blockIcon(j-1).repeat(state[j]))+'</span></span>').join('')}el.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{let j=Number(b.dataset.piece),next=state.slice();next[j]+=Number(b.dataset.delta);if(!model.valid(next)||model.total(next)>10000){feedback.textContent='材料不足或數量超出一萬範圍。';return}state=next;feedback.textContent='已調整材料。';render()});el.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{let next=model.exchange(state,Number(b.dataset.index),Number(b.dataset.direction));if(!next){feedback.textContent='材料不足，或交換後件數超過此示意工具範圍。';return}state=next;feedback.textContent='已完成交換，請自行比較總量。';render()});el.querySelector('.reset').onclick=()=>{state=original.slice();feedback.textContent='已清空材料，步驟紀錄保留。';render()};el.querySelector('.save-step').onclick=()=>{if(steps.length>=30){feedback.textContent='最多記錄30步。';return}steps.push(state.slice());el.querySelector('.step-log').innerHTML=steps.map(a=>'<li>'+['萬','千','百','十','個'].map((x,j)=>x+' '+a[j]+' 件').join('，')+'</li>').join('');feedback.textContent='已記錄目前材料。'};el.querySelector('.clear-steps').onclick=()=>{steps=[];el.querySelector('.step-log').innerHTML='';feedback.textContent='已清除步驟紀錄。'};render()});
$('#showAnswer').onchange=()=>document.querySelectorAll('.answer').forEach(x=>x.hidden=!$('#showAnswer').checked);$('#showKey').onchange=()=>$('#answerPage').hidden=!$('#showKey').checked;
</script></body></html>
