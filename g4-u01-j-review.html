l>寫數 <input type="text" inputmode="numeric"></label>';return '<article data-id="'+esc(q.id)+'"><strong>'+(i+1)+'. </strong><p>'+q.lines.map(esc).join('<br>')+'</p>'+field+' <button class="controls" type="button">檢查填寫</button><p class="feedback" role="status"></p><p>讀數與方法請成人確認。</p></article>'}).join('');key.innerHTML+='<ol>'+qs.map(q=>'<li>'+esc(q.answer)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>key.hidden=!e.target.checked;sheet.querySelectorAll('article').forEach((el,i)=>{let q=qs[i],p=q.params,input=el.querySelector('input'),sel=el.querySelector('select'),f=el.querySelector('.feedback');if(input)input.oninput=()=>f.textContent='';if(sel)sel.onchange=()=>f.textContent='';el.querySelector('button').onclick=()=>{let ok=false;if(q.task==='mixed_digit_value'){if(sel.value===''||!/^\d+$/.test(input.value.trim())){f.textContent='請選位名並用數字填寫數量。';return}ok=Number(sel.value)===p.position&&Number(input.value.trim())===p.value}else if(q.task==='mixed_compare'){if(!sel.value){f.textContent='請先選擇符號。';return}ok=sel.value===q.answer}else{let v=input.value.trim();if(!/^\d+$/.test(v)){f.textContent='請用數字填寫。';return}ok=Number(v)===p.number}f.textContent=ok?'填寫正確；讀數與方法請成人確認。':'請再檢查填寫。'}});</script></body></html>
