<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級｜第 35 單元：全年綜合複習與必要操作確認（52題候選）（試用版）</title><style>
/* Layout: controls on top; each practice sheet is a paper-like card of two question columns.
   Palette: warm paper neutrals with one deep-blue accent; red reserved for answers. */
:root {
  --bg: #f4f2ec;
  --fg: #1c2330;
  --muted: #5f6772;
  --card: #ffffff;
  --line: #d6d0c2;
  --accent: #2d5b86;
  --on-accent: #ffffff;
  --ans: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
    --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
  --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.row[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label { font-size: 14px; color: var(--muted); }
select, input[type="number"] {
  font: inherit;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  min-width: 0;
}
select { flex: 1 1 220px; max-width: 100%; }
input[type="number"] { width: 150px; max-width: 100%; }
.btn {
  font: inherit;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--fg); font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

.page {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-top: 16px;
}
.page-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
  font-size: 13px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.page-head h2 { grid-column: 1 / -1; margin: 0 0 2px; }
.fill { display: inline-block; min-width: 4em; border-bottom: 1px solid var(--line); }
.page-foot {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--rows), auto);
  column-gap: 22px;
  row-gap: 2px;
}
.q { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; font-size: 16px; }
.no { width: 2.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.pt { min-width: 0; overflow-wrap: anywhere; }
.blank { flex: 1 1 36px; min-width: 36px; border-bottom: 1px solid var(--line); height: 1.2em; }
.ans { display: none; color: var(--ans); font-weight: 700; flex: none; }
.show-ans .ans { display: inline; }
.pic .q { min-height: 84px; }
.pic svg { flex: none; width: 96px; height: 80px; color: var(--fg); }

.key {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 4px 12px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.mastery ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.mastery li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; }
.mastery li .q { min-height: 0; }
.mastery input {
  font: inherit;
  width: 96px;
  min-height: 40px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}
.fix { color: var(--ans); font-weight: 700; display: none; }
.mastery li.wrong .fix { display: inline; }
.result { font-weight: 700; font-size: 16px; }

@media (max-width: 480px) {
  .page-head { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
}

@media print {
  :root:root {
    --bg: #ffffff; --fg: #000000; --muted: #333333; --card: #ffffff;
    --line: #777777; --accent: #000000; --on-accent: #ffffff; --ans: #000000;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  body { padding: 0; background: #ffffff; color: #000000; }
  .wrap > h1, .lede, .panel, .mastery, .note { display: none !important; }
  .page { border: 0; border-radius: 0; margin: 0; padding: 0; break-after: page; }
  .page:last-of-type { break-after: auto; }
  .page-head { margin-bottom: 6px; padding-bottom: 6px; }
  .grid { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); row-gap: 0; }
  .text .q { height: 5.9mm; min-height: 0; font-size: 12pt; }
  .pic .q { height: 25mm; min-height: 0; font-size: 12pt; }
  .pic svg { width: 26mm; height: 22mm; }
  .page-foot { font-size: 9pt; }
  .answers { break-before: page; }
  .answers[hidden] { display: block !important; }
  .show-ans .ans { display: inline !important; }
}

 0 的除法直式（另有20題改編候選）</option><option value="g3-direct-u11-draft-20261113.html">第 11 單元：兩步驟連乘（另有20題改編候選）</option><option value="g3-direct-u12-draft-20261113.html">第 12 單元：加減與除的兩步驟（另有20題改編候選）</option><option value="g3-direct-u13-draft-20261113.html">第 13 單元：生活四則估算與合理性（另有20題改編候選）</option><option value="g3-direct-u14-draft-20261113.html">第 14 單元：單位分數點數與同分母比較（45題候選）</option><option value="g3-direct-u15-draft-20261113.html">第 15 單元：同分母加減及和等於1（45題候選）</option><option value="g3-direct-u16-draft-20261113.html">第 16 單元：大於1至2的分數活動（25題候選）</option><option value="g3-direct-u17-draft-20261113.html">第 17 單元：十分位與一位小數比較（23題候選）</option><option value="g3-direct-u18-draft-20261113.html">第 18 單元：一位小數直式加減與解題（25題候選）</option><option value="g3-direct-u19-draft-20261113.html">第 19 單元：從0開始的整數數線報讀標示（30題候選）</option><option value="g3-direct-u20-draft-20261113.html">第 20 單元：數線比較與加減（30題候選）</option><option value="g3-direct-u21-draft-20261113.html">第 21 單元：毫米實測估測與長度換算（19題候選）</option><option value="g3-direct-u22-draft-20261113.html">第 22 單元：角的操作比較與直角（25題候選）</option><option value="g3-direct-u23-draft-20261113.html">第 23 單元：平方公分實測與方格點數面積（28題候選）</option><option value="g3-direct-u24-draft-20261113.html">第 24 單元：公升毫升實測估測與換算加減（44題候選）</option><option value="g3-direct-u25-draft-20261113.html">第 25 單元：公斤公克實測估測與換算加減（44題候選）</option><option value="g3-direct-u26-draft-20261113.html">第 26 單元：日時分秒的實測與換算（30題候選）</option><option value="g3-direct-u27-draft-20261113.html">第 27 單元：同單位時間及時分無進退位加減（25題候選）</option><option value="g3-direct-u28-draft-20261113.html">第 28 單元：正長方形邊角特徵與斜擺辨認（20題候選）</option><option value="g3-direct-u29-draft-20261113.html">第 29 單元：圓心半徑直徑與圓規作圖（24題候選）</option><option value="g3-direct-u30-draft-20261113.html">第 30 單元：平面分割與重組（紙筆10題、實作6項）</option><option value="g3-direct-u31-draft-20261113.html">第 31 單元：展開圖與立體形體（紙筆10題、實作4項）</option><option value="g3-direct-u32-draft-20261113.html">第 32 單元：一維模式觀察、操作與說明（29題候選）</option><option value="g3-direct-u33-draft-20261113.html">第 33 單元：生活一維二維表格報讀（35題候選）</option><option value="g3-direct-u34-draft-20261113.html">第 34 單元：表格製作與模式呈現（16題候選）</option><option value="g3-direct-u35-draft-20261113.html" selected>第 35 單元：全年綜合複習與必要操作確認（52題候選）</option></select></div><div class="row"><label for="seed">練習編號</label><input id="seed" type="number" min="1" max="2147483646" value="1"><button class="btn" id="new" type="button">產生新練習單</button><button class="btn ghost" id="show" type="button">依編號重新產生</button></div><div class="row"><label class="check"><input id="showAns" type="checkbox">顯示參考答案</label><label class="check"><input id="showKey" type="checkbox">顯示答案頁</label></div><p>編號只重排現有 52 題；切換單元或重新產生會清除作答。</p><strong>試用／審查中：52 題跨單元複習候選，不是完整單元或精熟。</strong><p>每個單元至少有一項候選；其中第5至13單元沿用既有練習題，供複習而非獨立精熟。這不是完整全年複習或精熟測驗；估算、直式及實際操作由成人確認。</p></section><div id="questions"></div><section class="page controls"><button class="btn" id="checkAnswered" type="button">批改已作答題目</button><p id="summary" role="status"></p><p>方法、實作及題意均由成人確認。</p></section></main><script>const SOURCE=[{"id":"REVIEW-01","sourceUnit":2,"prompt":"3個百、12個十和4個一，合起來是多少？說明如何交換位值。","labels":["數字"],"values":[424],"answer":"300＋120＋4＝424；交換過程由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-02","sourceUnit":3,"prompt":"用直式算 368＋257，記下進位。","labels":["和"],"values":[625],"answer":"368＋257＝625。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-03","sourceUnit":4,"prompt":"用直式算 702－368，記下退位。","labels":["差"],"values":[334],"answer":"702－368＝334。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-04","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"PG01","prompt":"每組有24個，共2組。列一列乘法直式，記下位值與進位，求共有多少個。","values":[48],"labels":["共有幾個"],"answer":"24×2＝48個。","operands":[24,2],"sourceUnit":5},{"id":"REVIEW-05","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"PG03","prompt":"每組有101個，共2組。列一列乘法直式，記下位值與進位，求共有多少個。圈出被乘數中的0，說明該位的處理。","values":[202],"labels":["共有幾個"],"answer":"101×2＝202個。","operands":[101,2],"sourceUnit":6},{"id":"REVIEW-06","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"P02","prompt":"有6個小物，每3個裝一袋。求裝滿幾袋；全部裝完，用乘法核對。","values":[2],"labels":["滿袋數"],"answer":"6÷3＝2；2×3＝6。","operands":[6,3],"sourceUnit":7},{"id":"REVIEW-07","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"P04","prompt":"有7個小物，每3個裝一袋。求裝滿幾袋、還剩幾個，用乘法和剩量核對。","values":[2,1],"labels":["滿袋數","剩餘個數"],"answer":"7÷3＝2餘1；2×3＋1＝7。","operands":[7,3],"sourceUnit":8},{"id":"REVIEW-08","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"PG01","prompt":"把42個小物平均分成2組。列除法直式，逐位記下分、乘回與減，求每組個數。","values":[21],"labels":["每組個數"],"answer":"42÷2＝21個。","operands":[42,2],"sourceUnit":9},{"id":"REVIEW-09","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"PG03","prompt":"把202個小物平均分成2組。列除法直式，逐位記下分、乘回與減，求每組個數。注意商的0所在位。","values":[101],"labels":["每組個數"],"answer":"202÷2＝101個。","operands":[202,2],"sourceUnit":10},{"id":"REVIEW-10","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"P01","prompt":"有2箱，每箱3袋，每袋2枚。先求每箱幾枚，再求全部幾枚；分開寫兩個算式。","values":[6,12],"labels":["每箱枚數","全部枚數"],"answer":"3×2＝6枚；6×2＝12枚。","operands":[2,3,2],"sourceUnit":11},{"id":"REVIEW-11","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"P02/P03","prompt":"甲有3張卡，乙有5張，合起來平均分給2組。先求總張數，再求每組張數；分開寫兩個算式。","values":[8,4],"labels":["合計張數","每組張數"],"answer":"3＋5＝8張；8÷2＝4張。","operands":[3,5,2],"sourceUnit":12},{"id":"REVIEW-12","origin":"沿用本機練習改編題（複習，非獨立精熟）","sourceReference":"P01","prompt":"活動兩天分別約有301人與205人。不要先精算，選接近而好算的數估總人數，並說明你的估法。","values":[],"labels":[],"answer":"例如300＋200約等於500人；其他合理估法由成人確認。","operands":[301,205],"sourceUnit":13},{"id":"REVIEW-13","sourceUnit":14,"prompt":"同一整條分成5等份，取3份。所取份數是幾個1/5？用紙條說明。","labels":["所取份數"],"values":[3],"answer":"所取為3個1/5，即3/5條。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-14","sourceUnit":17,"prompt":"1.2是幾個0.1？用十分之一紙條解釋。","labels":["0.1的個數"],"values":[12],"answer":"1.2是12個0.1。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-15","sourceUnit":21,"prompt":"2公尺5公分等於多少毫米？說明單位換算。","labels":["毫米"],"values":[2050],"answer":"2公尺＝2000毫米，5公分＝50毫米，合計2050毫米。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-16","sourceUnit":23,"prompt":"圖案排成2排，每排3個同大小方格，每格代表1平方公分。逐格點數面積。","labels":["平方公分"],"values":[6],"answer":"共6個單位方格，即6平方公分。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-17","sourceUnit":24,"prompt":"1公升250毫升等於多少毫升？","labels":["毫升"],"values":[1250],"answer":"1公升＝1000毫升，合計1250毫升。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-18","sourceUnit":25,"prompt":"1公斤250公克等於多少公克？","labels":["公克"],"values":[1250],"answer":"1公斤＝1000公克，合計1250公克。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-19","sourceUnit":26,"prompt":"2分15秒合起來是多少秒？","labels":["秒"],"values":[135],"answer":"2分＝120秒，合計135秒。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-20","sourceUnit":28,"prompt":"用正方形圖卡、尺與直角工具，檢查四邊及四角，記錄如何知道它也符合長方形條件。","labels":[],"values":[],"answer":"四邊等長且四角為直角；實測及說明由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-21","sourceUnit":29,"prompt":"一個圓的直徑是6公分，半徑是多少公分？用尺與圓規畫圖說明。","labels":["半徑（公分）"],"values":[3],"answer":"半徑3公分；真實作圖由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-22","sourceUnit":31,"prompt":"使用第31單元的展開材料，實際剪、摺、黏成閉合立體，保留作品並記錄順序。","labels":[],"values":[],"answer":"實際剪、摺、黏與閉合須由成人檢查；文字記錄不代替作品。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-23","sourceUnit":32,"prompt":"依序擺2、4、6、8個小物，每步增加相同數量。第5步有幾個？","labels":["第5步個數"],"values":[10],"answer":"每步增加2，第5步10個。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-24","sourceUnit":33,"prompt":"表格記錄紅色3張、藍色5張、黃色2張；最多比最少多幾張？","labels":["多幾張"],"values":[3],"answer":"最多5張，最少2張，相差3張。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-25","sourceUnit":1,"prompt":"把8264寫在千百十個位值表，填每個位數，並完整讀出。","labels":["千位","百位","十位","個位"],"values":[8,2,6,4],"answer":"8千、2百、6十、4個；口讀由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-26","sourceUnit":15,"prompt":"同一整條分成8等份，先取3/8，再取2/8。填合量分子與分母，並用紙條說明。","labels":["分子","分母"],"values":[5,8],"answer":"3/8＋2/8＝5/8條。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-27","sourceUnit":16,"prompt":"每整條分成4等份，先有5/4條，再加1/4條。填合量分子與分母，並與1和2比較。","labels":["分子","分母"],"values":[6,4],"answer":"5/4＋1/4＝6/4條，大於1且小於2。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-28","sourceUnit":18,"prompt":"1.7個整體單位加上0.5個同樣單位；列直式，填結果的個位與十分位。","labels":["個位","十分位"],"values":[2,2],"answer":"1.7＋0.5＝2.2。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-29","sourceUnit":19,"prompt":"數線從0開始，每小格表示2，從0往右數7格是幾？畫線記數格方法。","labels":["刻度數"],"values":[14],"answer":"0往右7格，每格2，刻度14。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-30","sourceUnit":20,"prompt":"數線從7向右移6個單位，再向左移3個單位。填最後位置並分開列式。","labels":["最後位置"],"values":[10],"answer":"7＋6＝13；13－3＝10。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-31","sourceUnit":22,"prompt":"用兩根紙條做一個角，指出頂點與兩邊，改變開口後說明。","labels":[],"values":[],"answer":"真實紙條操作、開口與說明由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-32","sourceUnit":27,"prompt":"上午活動經過1時20分，下午經過2時15分。合計多久？","labels":["時","分"],"values":[3,35],"answer":"共3時35分，這是時間量。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-33","sourceUnit":30,"prompt":"畫正方形，沿中線剪成兩片，移動後再拼回；保留原圖與剪件並記錄。","labels":[],"values":[],"answer":"剪、移、拼及作品由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-34","sourceUnit":34,"prompt":"用真實卡片依顏色和形狀分類，製作表格並核對每張卡只計一次。","labels":[],"values":[],"answer":"實際卡片、分類與表格作品由成人確認。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-35","sourceUnit":14,"prompt":"同一整條各分7等份，甲取2份，乙取5份。乙比甲多幾份？用紙條說明。","labels":["多幾份"],"values":[3],"answer":"5－2＝3份。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-36","sourceUnit":15,"prompt":"一條紙帶分成9等份，已有7/9條，拿走4/9條。填剩下的分子與分母。","labels":["分子","分母"],"values":[3,9],"answer":"7/9－4/9＝3/9條。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-37","sourceUnit":16,"prompt":"每整條分成4等份，有7/4條再加1/4條。填合量分子、分母，並與2比較。","labels":["分子","分母"],"values":[8,4],"answer":"7/4＋1/4＝8/4條，等於2條。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-38","sourceUnit":17,"prompt":"把2.3記在位值表：有幾個1、幾個0.1？","labels":["1的個數","0.1的個數"],"values":[2,3],"answer":"2.3是2個1與3個0.1。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-39","sourceUnit":18,"prompt":"同單位的緞帶長3.2，剪去1.4。列直式，填剩餘長度的個位與十分位數字。","labels":["個位","十分位"],"values":[1,8],"answer":"3.2－1.4＝1.8。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-40","sourceUnit":20,"prompt":"數線上甲點是23、乙點是41。兩點距離是多少個單位？","labels":["距離"],"values":[18],"answer":"41－23＝18個單位。","origin":"來源單元改編候選（待審）"},{"id":"REVIEW-41","sourceUnit":21,"prompt":"一段長3公分7毫米的紙條，長多少毫米？用尺說明。","labels":["毫米"],"values":
