<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第9單元除法直式審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:8em;font-family:monospace}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.notes{height:45mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第9單元：除法直式</h1><section class="controls"><strong>公開審查稿：4題來源候選，屬同類直式練習；不是完整教材或精熟。</strong><p>按題意在紙上或下方記錄區列直式，保留每次分、乘回、減和換單位。按鈕只檢查商；位值對齊、商位、過程、說明與實物操作須由成人核對。第1題原題允許示範第一步，請記錄協助，不能視為獨立測量。重新整理清除作答；列印為空白卷；教育、手機及列印待驗證。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">公開來源審查稿；非完整教材或精熟。請由成人核對直式步驟、位值與所需操作。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>逐位說明是一種核對方式，商正確仍須核對過程及材料；第1題請記錄是否有示範。</p></section></main><script>
const items=[{"id":"PG01","facet":"algorithm","prompt":"把267平均分成3組。列除法直式，先指出商的最高位，再按每位分、乘回、減、換單位，保留完整過程。成人可示範第一步，但記提示後讓孩子完成。","answer":"267÷3＝89","operands":[267,3],"quotient":89,"remainder":0,"curriculum_codes":["N-3-5"],"manual_required":true,"education_review":"pending","notes":"原題允許成人示範第一步，需記錄協助；非獨立測量。","parent_steps":"百位：2個百不夠每組分1個，換成20個十後合併下一位；十位：26÷3，商8；8×3＝24，26－24＝2，餘2個十換成20個後合併下一位；個位：27÷3，商9；9×3＝27，27－27＝0。"},{"id":"PA01","facet":"algorithm","prompt":"把459平均分成3組。列除法直式，先指出商的最高位，再按每位分、乘回、減、換單位，保留完整過程。","answer":"459÷3＝153","operands":[459,3],"quotient":153,"remainder":0,"curriculum_codes":["N-3-5"],"manual_required":true,"education_review":"pending","notes":"直式步驟、材料對應及說明需成人核對。","parent_steps":"百位：4÷3，商1；1×3＝3，4－3＝1，餘1個百換成10個十後合併下一位；十位：15÷3，商5；5×3＝15，15－15＝0；個位：9÷3，商3；3×3＝9，9－9＝0。"},{"id":"PB01","facet":"algorithm","prompt":"把637平均分成7組。列除法直式，先指出商的最高位，再按每位分、乘回、減、換單位，保留完整過程。把材料記錄翻譯為直式，圈兩份作品同一位的量。","answer":"637÷7＝91","operands":[637,7],"quotient":91,"remainder":0,"curriculum_codes":["N-3-5"],"manual_required":true,"education_review":"pending","notes":"直式步驟、材料對應及說明需成人核對。","parent_steps":"百位：6個百不夠每組分1個，換成60個十後合併下一位；十位：63÷7，商9；9×7＝63，63－63＝0；個位：7÷7，商1；1×7＝7，7－7＝0。"},{"id":"PC01","facet":"algorithm","prompt":"把138平均分成3組。列除法直式，先指出商的最高位，再按每位分、乘回、減、換單位，保留完整過程。","answer":"138÷3＝46","operands":[138,3],"quotient":46,"remainder":0,"curriculum_codes":["N-3-5"],"manual_required":true,"education_review":"pending","notes":"直式步驟、材料對應及說明需成人核對。","parent_steps":"百位：1個百不夠每組分1個，換成10個十後合併下一位；十位：13÷3，商4；4×3＝12，13－12＝1，餘1個十換成10個後合併下一位；個位：18÷3，商6；6×3＝18，18－18＝0。"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>填寫商 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的商"></label><button type="button">檢查商</button><p class="feedback" role="status"></p><div class="print-only"><div>直式、分配與說明：</div><div class="notes"></div></div><label>記錄直式、分配與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範第一步</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>協助紀錄由成人填寫，僅保留本頁；不能單憑選項判定獨立作答。直式及材料操作須由成人核對。</p></article>').join('');document.querySelectorAll('article').forEach((el,i)=>{const input=el.querySelector('input'),f=el.querySelector('.feedback');input.oninput=()=>{f.textContent=''};el.querySelector('button').onclick=()=>{const s=input.value.trim();f.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].quotient?'商正確；其他要求仍請成人核對。':'商需要再檢查；請檢視每一步。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'<br>'+esc(q.parent_steps)+(q.id==='PG01'?'<br>原題允許示範第一步，請記錄協助。':'')+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
