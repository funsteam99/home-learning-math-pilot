<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第8單元有餘數審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:7em}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.notes{height:50mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第8單元：有餘數的除法</h1><section class="controls"><strong>公開審查稿：1題原來源概念任務，不是完整教材或精熟。</strong><p>依題意用真實小物裝袋、觀察剩量，並以紙筆或下方文字區記錄。網頁僅檢查滿袋數與剩量，不判定單位、算式、理由或實物操作；以上由成人核對。成人記錄協助情況，不能單憑選項判定獨立；重新整理清除作答，列印為空白卷。教育、手機、列印及實物試作待驗證。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">公開概念審查稿，非完整教材或精熟。請依題意使用真實小物與紙筆，由成人核對操作與理由。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>滿袋數與剩量正確，仍須核對實物分裝、單位、乘加還原及餘數為何小於每袋數量。</p></section></main><script>
const q={"id":"P04","facet":"remainder","source_task":"概念-remainder","role":"來源概念任務，作教學審查；不是精熟","prompt":"有42個小物，每袋5個。親自裝到不能再裝滿一袋，寫滿袋數與剩量，用乘加還原總量並說剩物為何不能再裝一袋。","answer":"8袋餘2；8×5＋2＝42；2＜5","operands":[42,5],"quotient":8,"remainder":2,"curriculum_codes":["N-3-4"],"manual_required":true,"education_review":"pending"};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#questions').innerHTML='<article><strong>1. </strong>'+esc(q.prompt)+'<label>滿袋數 <input class="quotient" type="text" inputmode="numeric" aria-label="滿袋數"></label><label>剩下的個數 <input class="remainder" type="text" inputmode="numeric" aria-label="剩下的個數"></label><button type="button">檢查數量</button><p class="feedback" role="status"></p><div class="print-only"><div>記錄裝袋、乘加還原與理由：</div><div class="notes"></div></div><label>記錄裝袋、乘加還原與理由<textarea aria-label="本題紀錄"></textarea></label><label>成人記錄協助情況 <select aria-label="本題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>單位、算式、理由及實物操作需成人核對。</p></article>';
const el=document.querySelector('article'),fields=[...el.querySelectorAll('input')],f=el.querySelector('.feedback');fields.forEach(x=>x.oninput=()=>{f.textContent=''});el.querySelector('button').onclick=()=>{const v=fields.map(x=>x.value.trim());f.textContent=v.some(x=>!/^\d+$/.test(x))?'請填入兩個數字後再檢查。':Number(v[0])===q.quotient&&Number(v[1])===q.remainder?'滿袋數與剩量正確；其他要求仍請成人核對。':'數量需要再檢查；請重看裝袋與剩量。'};document.querySelector('#key').innerHTML+='<p>'+esc(q.answer)+'</p>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
