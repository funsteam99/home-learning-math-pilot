<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年級第1單元 I包審查稿</title><style>body{font:15px/1.6 "Microsoft JhengHei",sans-serif;background:#f4f2ec;color:#1c2330;margin:16px}main{max-width:880px;margin:auto}article,.panel{background:#fff;border:1px solid #d6d0c2;border-radius:8px;padding:16px;margin:14px 0}button,input,textarea{font:inherit;min-height:42px;max-width:100%;box-sizing:border-box}input.response,textarea{display:block;width:100%}textarea{min-height:65px}p.feedback{font-weight:bold}@media print{body{background:white}.controls{display:none}.panel,article{border:0}.key{break-before:page}}</style></head><body><main><h1>數學自動學習系統</h1><p>五年級第1單元：位值分解｜I包試用／審查草稿</p><section class="panel"><p>本頁僅I包15題候選，非完整單元或精熟。請用阿拉伯數字寫非零位值，以加號連接，例如 3000+200+4；順序可以不同，小數可補尾零。網頁只檢查各加數，口讀及理由由成人確認。教育、手機、實際列印及兒童試作尚待審查。</p><label class="controls"><input id="showKey" type="checkbox"> 顯示家長答案</label><p>重新整理後作答不保留。</p></section><div id="sheet"></div><section id="key" class="key" hidden><h2>家長參考答案</h2></section></main><script>const qs=[{"id":"TW-G5-U01-I01","grade":5,"unit":"01","pack":"I","sheet":1,"code":["N-5-1"],"task":"place_value_sum","lines":["先說出 3204 各位數字代表的量。","把非零的位值量用加法連起來，表示原數。"],"answer":"3000＋200＋4＝3204","params":{"decimal":"3204","terms":["3000","200","4"]},"status":"draft_not_release_ready"},{"id":"TW-G5-U01-I02","grade":5,"unit":"01","pack":"I","sheet":1,"code":["N-5-1"],"task":"place_value_sum","lines":["先說出 4506 各位數字代表的量。","把非零的位值量用加法連起來，表示原數。"],"answer":"4000＋500＋6＝4506","params":{"decimal":"4506","terms":["4000","500","6"]},"status":"draft_not_release_ready"},{"id":"TW-G5-U01-I03","grade":5,"unit":"01","pack":"I","sheet":1,"code":["N-5-1"],"task":"place_value_sum","lines":["先說出 5708 各位數字代表的量。","把非零的位值量用加法連起來，表示原數。"],"answer":"5000＋700＋8＝5708","params":{"decimal":"5708","terms":["5000","700","8"]},"status":"draft_not_release_ready"},{"id":"TW-G5-U01-I04","grade":5,"unit":"01","pack":" #showKey').onchange=e=>key.hidden=!e.target.checked;sheet.querySelectorAll('article').forEach((el,i)=>{let input=el.querySelector('.response'),f=el.querySelector('.feedback');input.oninput=()=>f.textContent='';el.querySelector('button').onclick=()=>{let values=input.value.trim().replace(/＋/g,'+').split('+').map(x=>x.trim());if(values.some(x=>!/^\d+(?:\.\d{1,3})?$/.test(x))){f.textContent='請用數字和加號填寫各加數，最多到千分位。';return}let actual=values.map(Number).sort((a,b)=>a-b),expected=qs[i].params.terms.map(Number).sort((a,b)=>a-b);f.textContent=JSON.stringify(actual)===JSON.stringify(expected)?'各加數正確；口讀與理由請成人確認。':'請再檢查各個非零位值。'}});</script></body></html>
