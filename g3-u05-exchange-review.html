<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級乘法實物交換修訂審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}summary{cursor:pointer;color:#184f70;font-weight:bold;min-height:42px}fieldset{margin:8px 0}textarea{display:block;width:95%;min-height:6em}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,.log,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.notes{height:65mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第5單元：乘法實物交換</h1><section class="controls"><strong>公開修訂審查稿：4題同類候選，題意與教育審查尚未通過；非完整教材或精熟。</strong><p>先用真實位值積木擺出各組，再記錄積木件數及它們代表的總數。每次以相鄰位值交換，總數不變，但積木件數可能改變。按鈕只檢查積；材料、交換、直式與解釋須由成人核對。第一題允許成人示範第一步，請記錄提示，不能視為獨立作答。重新整理清除作答，列印為空白卷；手機及列印待驗證。</p><label><input type="checkbox" id="showKey">顯示家長答案頁</label></section><p class="print-only">公開修訂審查稿；使用真實積木並由成人核對交換、直式與說明。積木件數與其代表的總數不同。</p><div id="questions"></div><section class="key" id="key" hidden><h2>家長參考答案</h2><p>示例只是一種交換順序；請核對實際操作、總數守恆、直式及孩子的說明。</p></section></main><script>
const items=[{"id":"PG02","source_prompt":"每組384，共3組。親自擺每一組，點出總材料件數，逐次交換到標準位值；寫每步件數並完成一列積直式。成人可示範第一步，但記提示後讓孩子完成。","prompt":"每組384，共3組。親自擺每一組，點出各位積木件數與代表的總數，再逐次交換到標準位值；寫每步各位件數、交換前後代表的總數，並完成一列積直式。成人可示範第一步，但記提示後讓孩子完成。","source_answer":"384×3＝1152","operands":[384,3],"product":1152,"curriculum_codes":["N-3-3"],"revision_reason":"區分積木件數與其代表的總數，並補充交換前後的記錄；保留真實擺放及直式要求。","requires_real_operation":true,"education_review":"pending","parent_example":"合併各組後：0千、9百、24十、12個；10個換1十，變成0千、9百、25十、2個；代表總數仍是1152；10十換1百，變成0千、10百、15十、2個；代表總數仍是1152；10十換1百，變成0千、11百、5十、2個；代表總數仍是1152；10百換1千，變成1千、1百、5十、2個；代表總數仍是1152。"},{"id":"PA02","source_prompt":"每組267，共8組。親自擺每一組，點出總材料件數，逐次交換到標準位值；寫每步件數並完成一列積直式。","prompt":"每組267，共8組。親自擺每一組，點出各位積木件數與代表的總數，再逐次交換到標準位值；寫每步各位件數、交換前後代表的總數，並完成一列積直式。","source_answer":"267×8＝2136","operands":[267,8],"product":2136,"curriculum_codes":["N-3-3"],"revision_reason":"區分積木件數與其代表的總數，並補充交換前後的記錄；保留真實擺放及直式要求。","requires_real_operation":true,"education_review":"pending","parent_example":"合併各組後：0千、16百、48十、56個；10個換1十，變成0千、16百、49十、46個；代表總數仍是2136；10個換1十，變成0千、16百、50十、36個；代表總數仍是2136；10個換1十，變成0千、16百、51十、26個；代表總數仍是2136；10個換1十，變成0千、16百、52十、16個；代表總數仍是2136；10個換1十，變成0千、16百、53十、6個；代表總數仍是2136；10十換1百，變成0千、17百、43十、6個；代表總數仍是2136；10十換1百，變成0千、18百、33十、6個；代表總數仍是2136；10十換1百，變成0千、19百、23十、6個；代表總數仍是2136；10十換1百，變成0千、20百、13十、6個；代表總數仍是2136；10十換1百，變成0千、21百、3十、6個；代表總數仍是2136；10百換1千，變成1千、11百、3十、6個；代表總數仍是2136；10百換1千，變成2千、1百、3十、6個；代表總數仍是2136。"},{"id":"PB02","source_prompt":"每組586，共4組。親自擺每一組，點出總材料件數，逐次交換到標準位值；寫每步件數並完成一列積直式。把材料記錄翻譯為直式，圈兩份作品同一位的量。","prompt":"每組586，共4組。親自擺每一組，點出各位積木件數與代表的總數，再逐次交換到標準位值；寫每步各位件數、交換前後代表的總數，並完成一列積直式。把材料記錄翻譯為直式，圈兩份作品同一位的量。","source_answer":"586×4＝2344","operands":[586,4],"product":2344,"curriculum_codes":["N-3-3"],"revision_reason":"區分積木件數與其代表的總數，並補充交換前後的記錄；保留真實擺放及直式要求。","requires_real_operation":true,"education_review":"pending","parent_example":"合併各組後：0千、20百、32十、24個；10個換1十，變成0千、20百、33十、14個；代表總數仍是2344；10個換1十，變成0千、20百、34十、4個；代表總數仍是2344；10十換1百，變成0千、21百、24十、4個；代表總數仍是2344；10十換1百，變成0千、22百、14十、4個；代表總數仍是2344；10十換1百，變成0千、23百、4十、4個；代表總數仍是2344；10百換1千，變成1千、13百、4十、4個；代表總數仍是2344；10百換1千，變成2千、3百、4十、4個；代表總數仍是2344。"},{"id":"PC02","source_prompt":"每組258，共3組。親自擺每一組，點出總材料件數，逐次交換到標準位值；寫每步件數並完成一列積直式。","prompt":"每組258，共3組。親自擺每一組，點出各位積木件數與代表的總數，再逐次交換到標準位值；寫每步各位件數、交換前後代表的總數，並完成一列積直式。","source_answer":"258×3＝774","operands":[258,3],"product":774,"curriculum_codes":["N-3-3"],"revision_reason":"區分積木件數與其代表的總數，並補充交換前後的記錄；保留真實擺放及直式要求。","requires_real_operation":true,"education_review":"pending","parent_example":"合併各組後：0千、6百、15十、24個；10個換1十，變成0千、6百、16十、14個；代表總數仍是774；10個換1十，變成0千、6百、17十、4個；代表總數仍是774；10十換1百，變成0千、7百、7十、4個；代表總數仍是774。"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function logRow(i,n){return '<fieldset><legend>第'+n+'次交換</legend>'+['交換前各位積木件數','從哪一位換出多少件','換入哪一位及件數','交換後各位積木件數','交換前後代表的總數'].map(x=>'<label>'+x+' <input type="text" aria-label="第'+(i+1)+'題第'+n+'次交換'+x+'"></label>').join('')+'</fieldset>'}
function log(i){return '<details class="log"><summary>展開實物交換紀錄</summary><p>實際操作後填寫；此紀錄不自動判斷，可按需要增加記錄。</p><div class="log-rows">'+[1,2,3,4].map(n=>logRow(i,n)).join('')+'</div><button type="button" class="add-step">新增一次交換紀錄</button></details>'}
document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>填寫積 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的積"></label><button type="button">檢查積</button><p class="feedback" role="status"></p>'+log(i)+'<div class="print-only"><div>實物交換前後、代表總數及一列直式：</div><div class="notes"></div></div><label>記錄各組、交換、直式與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範第一步</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>協助情況由成人填寫，僅保留本頁，重新整理清除；不能單憑選項判定獨立作答。真實操作、交換及直式由成人核對。</p></article>').join('');
document.querySelectorAll('article').forEach((el,i)=>{const input=el.querySelector('input'),feedback=el.querySelector('.feedback');input.oninput=()=>{feedback.textContent=''};el.querySelector('button').onclick=()=>{const s=input.value.trim();feedback.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].product?'積正確；其他要求仍請成人核對。':'積需要再檢查；請檢視每一位。'};el.querySelector('.add-step').onclick=()=>{const rows=el.querySelector('.log-rows');rows.insertAdjacentHTML('beforeend',logRow(i,rows.querySelectorAll('fieldset').length+1));}});
document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.source_answer)+'<br>'+esc(q.parent_example)+(q.id==='PG02'?'<br>原題允許示範第一步，請記錄提示。':'')+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
