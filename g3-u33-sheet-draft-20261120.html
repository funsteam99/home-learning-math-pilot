<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第13單元估算審查稿</title><style>
/* Layout: controls on top; each practice sheet is a paper-like card of two question columns.
   Palette: warm paper neutrals with one deep-blue accent; red reserved for answers. */
:root {
  --bg: #f4f2ec;
  --fg: #1c2330;
  --muted: #5f6772;
  --card: #ffffff;
  --line: #d6d0c2;
  --accent: #2d5b86;
  --on-accent: #ffffff;
  --ans: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
    --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
  --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.row[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label { font-size: 14px; color: var(--muted); }
select, input[type="number"] {
  font: inherit;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  min-width: 0;
}
select { flex: 1 1 220px; max-width: 100%; }
input[type="number"] { width: 150px; max-width: 100%; }
.btn {
  font: inherit;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--fg); font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

.page {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-top: 16px;
}
.page-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
  font-size: 13px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.page-head h2 { grid-column: 1 / -1; margin: 0 0 2px; }
.fill { display: inline-block; min-width: 4em; border-bottom: 1px solid var(--line); }
.page-foot {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--rows), auto);
  column-gap: 22px;
  row-gap: 2px;
}
.q { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; font-size: 16px; }
.no { width: 2.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.pt { min-width: 0; overflow-wrap: anywhere; }
.blank { flex: 1 1 36px; min-width: 36px; border-bottom: 1px solid var(--line); height: 1.2em; }
.ans { display: none; color: var(--ans); font-weight: 700; flex: none; }
.show-ans .ans { display: inline; }
.pic .q { min-height: 84px; }
.pic svg { flex: none; width: 96px; height: 80px; color: var(--fg); }

.key {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 4px 12px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.mastery ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.mastery li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; }
.mastery li .q { min-height: 0; }
.mastery input {
  font: inherit;
  width: 96px;
  min-height: 40px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}
.fix { color: var(--ans); font-weight: 700; display: none; }
.mastery li.wrong .fix { display: inline; }
.result { font-weight: 700; font-size: 16px; }

@media (max-width: 480px) {
  .page-head { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
}

@media print {
  :root:root {
    --bg: #ffffff; --fg: #000000; --muted: #333333; --card: #ffffff;
    --line: #777777; --accent: #000000; --on-accent: #ffffff; --ans: #000000;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  body { padding: 0; background: #ffffff; color: #000000; }
  .wrap > h1, .lede, .panel, .mastery, .note { display: none !important; }
  .page { border: 0; border-radius: 0; margin: 0; padding: 0; break-after: page; }
  .page:last-of-type { break-after: auto; }
  .page-head { margin-bottom: 6px; padding-bottom: 6px; }
  .grid { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); row-gap: 0; }
  .text .q { height: 5.9mm; min-height: 0; font-size: 12pt; }
  .pic .q { height: 25mm; min-height: 0; font-size: 12pt; }
  .pic svg { width: 26mm; height: 22mm; }
  .page-foot { font-size: 9pt; }
  .answers { break-before: page; }
  .answers[hidden] { display: block !important; }
  .show-ans .ans { display: inline !important; }
}

function question(q,i){if(q.facet==='one'){let labels=['上午','中午','下午'],table='<table><caption>各時段使用的盒彩紙</caption><thead><tr><th scope="col">時段</th><th scope="col">數量（盒）</th></tr></thead><tbody>'+labels.map((x,j)=>'<tr><th scope="row">'+x+'</th><td>'+q.counts[j]+'</td></tr>').join('')+'</tbody></table>',options=['上午','中午','下午','上午、中午','上午、下午','中午、下午','上午、中午、下午'];return '<article class="item" data-id="'+esc(q.id)+'"><strong>'+(i+1)+'. </strong>'+(q.origin?'<span class="note">'+esc(q.origin)+'</span>':'')+'<p>'+esc(q.prompt)+'</p>'+table+'<label>最多時段（並列選完整組合） <select class="max"><option value="">請選擇</option>'+options.map(x=>'<option>'+x+'</option>').join('')+'</select></label> <label>上午與下午相差幾盒 <input class="diff" type="text" inputmode="numeric"></label> <button class="check controls" type="button">檢查填寫</button><p class="feedback" role="status"></p><label>記錄閱讀表格的方法與說明 <textarea aria-label="記錄閱讀表格的方法與說明"></textarea></label><p class="note">網頁核對最多時段及差距；表格意義及說明由成人確認。</p><div class="answer" hidden>參考答案：'+esc(q.answer)+'</div></article>'}let table='<table><caption>圖形數量表</caption><thead><tr><th scope="col">顏色／形狀</th><th scope="col">圓</th><th scope="col">三角</th></tr></thead><tbody>'+['紅','藍'].map((color,r)=>'<tr><th scope="row">'+color+'</th>'+['圓','三角'].map((shape,c)=>'<td><button type="button" class="cell" aria-label="'+color+shape+'，'+q.counts[r*2+c]+'個" aria-pressed="false">'+q.counts[r*2+c]+'</button></td>').join('')+'</tr>').join('')+'</tbody></table>';return '<article class="item" data-id="'+esc(q.id)+'"><strong>'+(i+1)+'. </strong>'+(q.origin?'<span class="note">'+esc(q.origin)+'</span>':'')+'<p>'+esc(q.prompt)+'</p>'+table+'<p>可點選表格中的數字標記，再點一次取消。</p><label>藍三角有幾個 <input class="blue" type="text" inputmode="numeric"></label> <label>紅圓有幾個 <input class="red" type="text" inputmode="numeric"></label> <button class="check controls" type="button">檢查填寫</button><p class="feedback" role="status"></p><label>記錄如何對準列欄及說明 <textarea aria-label="記錄如何對準列欄及說明"></textarea></label><p class="note">網頁核對數字；定位紙、行列條件與口說由成人確認。</p><div class="answer" hidden>參考答案：'+esc(q.answer)+'</div></article>'}
function render(items,n){$('#questions').innerHTML='<section class="page"><div class="page-head"><h2>第 33 單元：生活一維二維表格報讀</h2><span>練習編號 '+esc(n)+'　｜　'+items.length+' 題候選</span></div><div class="question-list">'+items.map(question).join('')+'</div></section><section class="page key" id="key" hidden><h2>家長參考答案</h2>'+items.map((q,i)=>'<p>'+(i+1)+'. '+esc(q.answer)+'</p>').join('')+'</section>';document.querySelectorAll('#questions article').forEach((card,i)=>{let q=items[i],f=card.querySelector('.feedback'),fields=[...card.querySelectorAll('input')];let maxSelect=card.querySelector('.max');if(maxSelect)maxSelect.onchange=()=>f.textContent='';card.querySelectorAll('.cell').forEach(t=>t.onclick=()=>{t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')==='true'?'false':'true');card.dataset.marked=card.querySelectorAll('.cell[aria-pressed="true"]').length?'1':'0';f.textContent=''});fields.forEach(x=>x.oninput=()=>f.textContent='');card.querySelector('.check').onclick=()=>{if(fields.some(x=>!x.value.trim())){f.textContent='請先完成兩個數字欄位。';return}let ok;if(q.facet==='one'){let choice=card.querySelector('.max').value;if(!choice){f.textContent='請先選擇最多時段。';return}let max=Math.max(...q.counts),expected=['上午','中午','下午'].filter((_,j)=>q.counts[j]===max).join('、');ok=choice===expected&&integer(card.querySelector('.diff').value)===Math.abs(q.counts[0]-q.counts[2])}else ok=integer(card.querySelector('.blue').value)===q.counts[3]&&integer(card.querySelector('.red').value)===q.counts[0];f.textContent=ok?'填寫數字正確；定位及說明請成人確認。':'請再核對表格與所選項目。'}});toggle()}
function toggle(){document.querySelectorAll('#questions .answer').forEach(x=>x.hidden=!$('#showAns').checked);let key=$('#key');if(key)key.hidden=!$('#showKey').checked}$('#showAns').onchange=toggle;$('#showKey').onchange=toggle;$('#show').onclick=()=>{let n=Number($('#seed').value);if(!Number.isSafeInteger(n)||n<1||n>2147483646){alert('請輸入 1 至 2147483646 的練習編號。');return}$('#summary').textContent='';render(shuffle(SOURCE,n),n)};$('#new').onclick=()=>{$('#seed').value=1+Math.floor(Math.random()*2147483645);$('#show').click()};$('#checkAnswered').onclick=()=>{let n=0;document.querySelectorAll('#questions article').forEach(card=>{if([...card.querySelectorAll('input,select,textarea')].some(x=>x.value.trim())||card.dataset.marked==='1'){n++;card.querySelector('.check').click()}});$('#summary').textContent='已處理 '+n+' 題填寫或標記；定位與口說請成人確認。'};$('#show').click();
</script></body></html>
