<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年級數學練習單</title><style>
/* Layout: controls on top; each practice sheet is a paper-like card of two question columns.
   Palette: warm paper neutrals with one deep-blue accent; red reserved for answers. */
:root {
  --bg: #f4f2ec;
  --fg: #1c2330;
  --muted: #5f6772;
  --card: #ffffff;
  --line: #d6d0c2;
  --accent: #2d5b86;
  --on-accent: #ffffff;
  --ans: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
    --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
  --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.row[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label { font-size: 14px; color: var(--muted); }
select, input[type="number"] {
  font: inherit;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  min-width: 0;
}
select { flex: 1 1 220px; max-width: 100%; }
input[type="number"] { width: 150px; max-width: 100%; }
.btn {
  font: inherit;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--fg); font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

.page {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-top: 16px;
}
.page-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
  font-size: 13px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.page-head h2 { grid-column: 1 / -1; margin: 0 0 2px; }
.fill { display: inline-block; min-width: 4em; border-bottom: 1px solid var(--line); }
.page-foot {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--rows), auto);
  column-gap: 22px;
  row-gap: 2px;
}
.q { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; font-size: 16px; }
.no { width: 2.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.pt { min-width: 0; overflow-wrap: anywhere; }
.blank { flex: 1 1 36px; min-width: 36px; border-bottom: 1px solid var(--line); height: 1.2em; }
.ans { display: none; color: var(--ans); font-weight: 700; flex: none; }
.show-ans .ans { display: inline; }
.pic .q { min-height: 84px; }
.pic svg { flex: none; width: 96px; height: 80px; color: var(--fg); }

.key {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 4px 12px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.mastery ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.mastery li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; }
.mastery li .q { min-height: 0; }
.mastery input {
  font: inherit;
  width: 96px;
  min-height: 40px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}
.fix { color: var(--ans); font-weight: 700; display: none; }
.mastery li.wrong .fix { display: inline; }
.result { font-weight: 700; font-size: 16px; }

@media (max-width: 480px) {
  .page-head { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
}

@media print {
  :root:root {
    --bg: #ffffff; --fg: #000000; --muted: #333333; --card: #ffffff;
    --line: #777777; --accent: #000000; --on-accent: #ffffff; --ans: #000000;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  body { padding: 0; background: #ffffff; color: #000000; }
  .wrap > h1, .lede, .panel, .mastery, .note { display: none !important; }
  .page { border: 0; border-radius: 0; margin: 0; padding: 0; break-after: page; }
  .page:last-of-type { break-after: auto; }
  .page-head { margin-bottom: 6px; padding-bottom: 6px; }
  .grid { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); row-gap: 0; }
  .text .q { height: 5.9mm; min-height: 0; font-size: 12pt; }
  .pic .q { height: 25mm; min-height: 0; font-size: 12pt; }
  .pic svg { width: 26mm; height: 22mm; }
  .page-foot { font-size: 9pt; }
  .answers { break-before: page; }
  .answers[hidden] { display: block !important; }
  .show-ans .ans { display: inline !important; }
}

.dot.square{border-radius:0}.dot.crossed{position:relative}.dot.crossed:after{content:"×";position:absolute;font-size:27px;line-height:18px;color:var(--ans);left:1px;top:0}[hidden]{display:none!important}.question-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.item{border-bottom:1px solid var(--line);padding:10px 0;min-width:0}.item p{margin:5px 0}.item input[type=number]{width:75px;min-height:40px}.dots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.dot{width:18px;height:18px;border-radius:50%;background:var(--fg);display:inline-block}.options{display:flex;gap:6px;flex-wrap:wrap}.smallbtn{font:inherit;min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}.smallbtn.selected{background:var(--accent);color:var(--on-accent)}.drawbtn{border-radius:50%;padding:0;width:40px}.feedback{color:var(--ans);font-weight:bold}.pair{display:flex;align-items:center;gap:6px;margin:4px 0}.pair select{flex:0 1 95px;min-height:38px}.resultbox{padding:12px;background:var(--bg);border-radius:6px}.mastery input[type=radio],.mastery input[type=checkbox]{width:18px;min-height:0;height:18px}.mastery fieldset{border:0;padding:0}.mastery label{color:var(--fg)}.item label{color:var(--fg)}.page-head{display:block}.note{line-height:1.6}@media(max-width:600px){.question-list{grid-template-columns:1fr}}@media print{.question-list{grid-template-columns:1fr 1fr}.panel.mastery{display:none!important}}
</style></head><body><div class="wrap"><h1>一年級數學練習單</h1><p class="lede">選擇單元，產生新的練習單。同一個編號可以重現同一份題目。</p><section class="panel" aria-label="練習單設定"><div class="row"><label for="unit">單元</label><select id="unit"><option value="01">第 1 單元：10 以內的數（試行）</option><option value="12">第 12 單元：10 以內加減應用（試行）</option><option value="14">第 14 單元：加法順序與算式（試行）</option><option value="16">第 16 單元：30 以內數序與比較（試行）</option><option value="17">第 17 單元：10 以內加減綜合（試行）</option><option value="18">第 18 單元：30 以內綜合練習（試行）</option><option value="20">第 20 單元：上學期總複習（試行）</option><option value="22">第 22 單元：20 以內加法（湊十）（試行）</option><option value="23">第 23 單元：20 以內加法（試行）</option><option value="24">第 24 單元：20 以內減法（試行）</option><option value="25">第 25 單元：20 以內加減混合（試行）</option><option value="30">第 30 單元：100 以內數序與位置（試行）</option><option value="36">第 36 單元：下學期綜合練習（試行）</option><option value="39">第 39 單元：下學期綜合應用（試行）</option><option value="40">第 40 單元：總複習（試行）</option></select></div><div class="row"><label for="seed">練習編號</label><input id="seed" type="number" min="1" max="2147483646" inputmode="numeric"><button class="btn" id="gen">產生新練習單</button><button class="btn ghost" id="again">依編號重新產生</button></div><div class="row"><label class="check"><input type="checkbox" id="showAns"> 顯示答案</label><label class="check"><input type="checkbox" id="showKey"> 顯示答案頁</label></div><p class="note">使用現行單元 150 題；目前重新出題會變換順序。可在網頁作答，或使用瀏覽器列印。</p></section><div id="sheet" aria-live="polite"></div><section class="panel mastery" aria-labelledby="mtitle"><h2 id="mtitle">精熟測驗（獨立 10 題；首次答對至少 9 題）</h2><p class="note">測驗時間先作參考。部分操作題使用線上圓片；說明題尚不能自動判定，需另行確認。</p><div class="row"><button class="btn" id="mStart">開始測驗</button><span class="note" id="timer"></span></div><div id="mList"></div><div class="row" id="mCheckRow" hidden><button class="btn" id="mCheck">提交測驗</button><span class="result" id="mResult"></span></div><div id="mFollow"></div></section><p class="note">試行草案：題目與答案隨網頁公開；其他單元的聽讀、鐘面及部分操作題仍待轉換，本版不含帳號、跨裝置紀錄或進度權限。</p></div><script src="data-01.js"></script><script src="data-12.js"></script><script src="data-14.js"></script><script src="data-16-v2.js"></script><script src="data-17.js"></script><script src="data-18.js"></script><script src="data-20.js"></script><script src="data-22-v2.js"></script><script src="data-23.js"></script><script src="data-24.js"></script><script src="data-25.js"></script><script src="data-30-v2.js"></script><script src="data-36.js"></script><script src="data-39.js"></script><script src="data-40.js"></script><script src="chairman-app-v10.js"></script></body></html>
