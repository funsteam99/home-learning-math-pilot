function stimulus(q){const p=q.params||{};if(['table_to_real_and_write','given_table'].includes(q.task)){return '<table class="table"><caption>題目給出的位值表</caption><tr><th>千</th><th>百</th><th>十</th><th>個</th></tr><tr>'+p.counts.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr></table>'}if(q.task==='local_number_pattern'){return '<p>數列：'+p.sequence.map((n,i)=>p.given_positions.includes(i)?esc(n):'<label>空格 <input type="number" class="seq" data-index="'+i+'" aria-label="數列第 '+(i+1)+' 格"></label>').join('　')+'</p>'}return ''}
function fields(q){let t=q.task;if(t==='local_number_pattern')return '';if(['numeral_to_table_and_real','fill_table','mixed_make_read'].includes(t))return '<div class="count-row">'+['千','百','十','個'].map((x,i)=>'<label>'+x+' <input class="count" type="number" min="0" max="9" data-index="'+i+'"></label>').join('')+'</div>';if(['oral_read','read'].includes(t))return '<p>請成人記錄首次口讀，待確認。</p>';if(['compare_place_values','compare'].includes(t))return '<label>比較符號 <select class="compare"><option value="">請選擇</option><option>＜</option><option>＝</option><option>＞</option></select></label>';return '<label>作答記錄 <input class="response" type="text"></label>'}
function blockIcon(i){let grid='<rect x="0" y="0" width="20" height="20" fill="white" stroke="black" stroke-width=".6"/>'+Array.from({length:9},(_,j)=>'<path d="M'+((j+1)*2)+' 0v20M0 '+((j+1)*2)+'h20" stroke="black" stroke-width=".25"/>').join('');if(i===0)return '<svg width="58" height="58" viewBox="0 0 60 60" aria-hidden="true">'+Array.from({length:10},(_,j)=>'<g transform="translate('+(j*3)+','+(j*3)+')">'+grid+'</g>').join('')+'</svg>';if(i===1)return '<svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true">'+grid+'</svg>';if(i===2)return '<svg width="12" height="30" viewBox="0 0 4 20" aria-hidden="true"><rect x="1" y="0" width="2" height="20" fill="white" stroke="black" stroke-width=".4"/>'+Array.from({length:9},(_,j)=>'<path d="M1 '+((j+1)*2)+'h2" stroke="black" stroke-width=".3"/>').join('')+'</svg>';return '<svg width="10" height="10" viewBox="0 0 2 2" aria-hidden="true"><rect width="2" height="2" fill="black"/></svg>'}
function blocks(q){if(!['table_to_real_and_write','numeral_to_table_and_real','mixed_make_read','given_table','fill_table'].includes(q.task))return '';let names=['千方塊','百片','十條','個塊'];return '<div class="blocks controls"><p>線上積木示意：一千由10個百片組成，一百由10條十組成。按＋或－調整數量，實物操作仍請成人觀察。</p>'+names.map((name,i)=>'<div class="row"><span>'+name+'：</span><button type="button" data-block="'+i+'" data-delta="-1" aria-label="減少'+name+'">−</button><span data-block-count="'+i+'">0</span><button type="button" data-block="'+i+'" data-delta="1" aria-label="增加'+name+'">＋</button><span data-block-pictures="'+i+'" aria-label="'+name+'示意"></span></div>').join('')+'</div>'}
function card(q,i){let listen=['listen_write','listen'].includes(q.task),master=q.kind==='mastery';return `<article class="question" data-id="${esc(q.id)}"><strong>${i+1}. </strong>${q.prompt.map(x=>'<p>'+esc(x)+'</p>').join('')}${stimulus(q)}${fields(q)}${blocks(q)}${listen?'<button type="button" class="voice controls">播放題目數字</button><span class="voice-status note" role="status"></span><p class="note">若無聲音，請成人查看家長答案後讀題，並避免讓孩子看到答案。</p>':''}<p class="note">需確認：${esc(q.requires_confirmation)}。</p>${master?'':'<button type="button" class="check controls">檢查可判定的填寫</button>'}<p class="feedback" role="status"></p><div class="key" hidden>參考答案：${esc(q.answer_for_review)}</div></article>`}
function render(target,items){target.innerHTML='<section class="paper"><h2>'+ (target.id==='exam'?'獨立精熟測驗':'練習包 '+esc($('#pack').value)+'｜編號 '+esc($('#seed').value)) +'</h2>'+items.map(card).join('')+'</section>';target.querySelectorAll('.question').forEach((el,i)=>{let q=items[i],p=q.params||{},voice=el.querySelector('.voice'),check=el.querySelector('.check');let blockState=[0,0,0,0];el.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.block),n=blockState[i]+Number(b.dataset.delta);if(n<0||n>9)return;blockState[i]=n;el.querySelector('[data-block-count="'+i+'"]').textContent=String(n);el.querySelector('[data-block-pictures="'+i+'"]').innerHTML=blockIcon(i).repeat(n)});if(voice)voice.onclick=()=>{let status=el.querySelector('.voice-status');if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){status.textContent='裝置不支援語音，請成人讀題。';return}let u=new SpeechSynthesisUtterance(String(p.number));u.lang='zh-TW';u.onerror=()=>status.textContent='播放失敗，請成人讀題。';window.speechSynthesis.cancel();window.speechSynthesis.speak(u);status.textContent='已要求播放，請確認裝置有聲音。'};if(!check)return;check.onclick=()=>{let result=el.querySelector('.feedback'),inputs=[...el.querySelectorAll('input')],comp=el.querySelector('.compare');if(q.task==='local_number_pattern'){let blank=inputs.some(x=>x.value.trim()==='');if(blank){result.textContent='請先填寫所有空格。';return}result.textContent=inputs.every(x=>Number(x.value)===p.sequence[Number(x.dataset.index)])?'填寫的數列正確；完整讀數請成人確認。':'請再檢查數列。';return}if(['table_to_real_and_write','listen_write'].includes(q.task)){let input=el.querySelector('.response');if(!input.value.trim()){result.textContent='請先填寫數字。';return}if(!/^\d+$/.test(input.value.trim())){result.textContent='請使用數字填寫。';return}result.textContent=Number(input.value)===p.number?'數字正確；讀數與實物操作仍請成人確認。':'請再檢查數字。';return}if(comp){if(!comp.value){result.textContent='請先選擇符號。';return}let expected=p.a<p.b?'＜':p.a>p.b?'＞':'＝';result.textContent=comp.value===expected?'符號正確；理由請成人確認。':'請再比較位值。';return}if(el.querySelectorAll('.count').length){if(inputs.some(x=>x.value.trim()==='')){result.textContent='請填寫各位數量。';return}let ok=inputs.every(x=>Number(x.value)===p.counts[Number(x.dataset.index)]);result.textContent=ok?'位值數量正確；讀數與實物操作請成人確認。':'請再檢查各位數量。';return}result.textContent='此題需由成人依參考答案確認，暫不自動評分。'} });toggle()}
let deadline=0,tick=null,submitted=false;function shuffle(items,seed){let a=items.slice(),s=seed>>>0;for(let i=a.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;let j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function toggle(){document.querySelectorAll('#sheet .key').forEach(el=>el.hidden=!$('#showAnswer').checked)}
$('#show').onclick=()=>{let n=Number($('#seed').value);if(!Number.isSafeInteger(n)||n<1||n>2147483646){alert('請輸入 1 至 2147483646 的練習編號。');return}render($('#sheet'),shuffle(data.filter(q=>q.kind==='practice'&&q.id.includes('U01-'+$('#pack').value)),n))};$('#new').onclick=()=>{$('#seed').value=1+Math.floor(Math.random()*2147483645);$('#show').click()};$('#pack').onchange=()=>$('#show').click();
function clock(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('#timer').textContent=left?'剩餘 '+Math.floor(left/60)+' 分 '+String(left%60).padStart(2,'0')+' 秒':'時間已到，仍可提交；不符合限時條件。';if(!left)clearInterval(tick)}
$('#mastery').onclick=()=>{clearInterval(tick);submitted=false;deadline=Date.now()+300000;$('#result').textContent='';$('#submit').hidden=false;render($('#exam'),data.filter(q=>q.kind==='mastery'));clock();tick=setInterval(clock,1000)};$('#submit').onclick=()=>{if(submitted)return;submitted=true;clearInterval(tick);let elapsed=Date.now()-deadline+300000;$('#exam').querySelectorAll('input,select,button').forEach(x=>x.disabled=true);$('#exam').querySelectorAll('.key').forEach(x=>x.hidden=false);$('#submit').hidden=true;$('#timer').textContent=elapsed<=300000?'已在暫定時限內提交。':'已超過暫定時限提交。';$('#result').textContent='作答已固定。請成人核對首次答案、口讀、說明與實物操作；本頁不自動宣告通過。'};$('#showAnswer').onchange=toggle;$('#show').click();
