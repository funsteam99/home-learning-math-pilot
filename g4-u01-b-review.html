heet":4,"code":["N-4-1"],"task":"digit_value","lines":["圈起來的數字在哪一位？表示多少？"],"answer":"萬位；60000","params":{"number":45067890,"position":3,"value":60000},"status":"draft_not_release_ready"},{"id":"TW-G4-U01-B13","grade":4,"unit":"01","pack":"B","sheet":5,"code":["N-4-1"],"task":"digit_value","lines":["圈起來的數字在哪一位？表示多少？"],"answer":"千位；8000","params":{"number":56078901,"position":4,"value":8000},"status":"draft_not_release_ready"},{"id":"TW-G4-U01-B14","grade":4,"unit":"01","pack":"B","sheet":5,"code":["N-4-1"],"task":"digit_value","lines":["圈起來的數字在哪一位？表示多少？"],"answer":"百位；0","params":{"number":67089012,"position":5,"value":0},"status":"draft_not_release_ready"},{"id":"TW-G4-U01-B15","grade":4,"unit":"01","pack":"B","sheet":5,"code":["N-4-1"],"task":"digit_value","lines":["圈起來的數字在哪一位？表示多少？"],"answer":"十位；20","params":{"number":78090123,"position":6,"value":20},"status":"draft_not_release_ready"}],labels=['千萬','百萬','十萬','萬','千','百','十','個'],esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sheet=document.querySelector('#sheet'),key=document.querySelector('#key');sheet.innerHTML=questions.map((q,i)=>{let digits=String(q.params.number).padStart(8,'0'),pos=q.params.position;return '<article data-id="'+esc(q.id)+'"><strong>'+(i+1)+'. </strong><p>'+q.lines.map(esc).join('<br>')+'</p><p class="number" aria-label="數字 '+digits+'，圈選從左數第 '+(pos+1)+' 位">'+[...digits].map((d,j)=>'<span class="digit '+(j===pos?'marked':'')+'">'+d+'</span>').join('')+'</p><label>位名 <select><option value="">請選擇</option>'+labels.map((x,j)=>'<option value="'+j+'">'+x+'位</option>').join('')+'</select></label> <label>表示多少 <input type="text" inputmode="numeric"></label> <button class="controls" type="button">檢查</button><p class="feedback" role="status"></p><p>說明請成人確認。</p></article>'}).join('');key.innerHTML+='<ol>'+questions.map(q=>'<li>'+esc(q.answer)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>key.hidden=!e.target.checked;sheet.querySelectorAll('article').forEach((el,i)=>{let inp=el.querySelector('input'),sel=el.querySelector('select'),f=el.querySelector('.feedback');inp.oninput=()=>f.textContent='';sel.onchange=()=>f.textContent='';el.querySelector('button').onclick=()=>{let v=inp.value.trim();if(sel.value===''||!/^\d+$/.test(v)){f.textContent='請選擇位名並用數字填寫數量。';return}let a=Number(sel.value)===questions[i].params.position,b=Number(v)===questions[i].params.value;f.textContent=a&&b?'位名與數量正確；說明請成人確認。':!a&&!b?'請再檢查位名與數量。':!a?'請再檢查位名。':'請再檢查數量。'}});</script></body></html>
