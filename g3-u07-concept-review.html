<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第7單元除法概念審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:7em}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.notes{height:40mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第7單元：整除與乘除關係</h1><section class="controls"><strong>公開審查稿：4題原來源概念任務，不是完整教材或精熟。</strong><p>依題意用真實小物、紙筆完成分配、分組、畫圖及說明。網頁只檢查輸入的數量，不判定單位、算式、理由或實物操作；以上均由成人核對。成人自行記錄協助，不能單憑選項判定獨立。重新整理清除作答，列印為空白卷；教育、手機、列印及實物試作待驗證。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">公開概念審查稿，非完整教材或精熟。請依題意使用真實小物與紙筆，成人核對操作和說明。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>數量正確仍須核對單位、算式、解釋及實際操作；概念題不作獨立精熟判定。</p></section></main><script>
const items=[{"id":"P01","facet":"sharing","source_task":"概念-sharing","role":"來源概念任務，作教學審查；不是獨立精熟","prompt":"用21個小物平均給3位孩子。先逐輪分，再用每組同量核對，說每人所得和除法中各數角色。","answer":"21÷3＝7；每人7個","operands":[21,3],"quotient":7,"concept_multiplier":null,"curriculum_codes":["N-3-4"],"manual_required":true,"education_review":"pending"},{"id":"P02","facet":"grouping","source_task":"概念-grouping","role":"來源概念任務，作教學審查；不是獨立精熟","prompt":"用32個小物，每4個裝一袋。親自裝袋，邊裝邊記累計，說完整袋數與除法中各數角色。","answer":"8袋；累計4、8、12、16、20、24、28、32；32÷4＝8","operands":[32,4],"quotient":8,"concept_multiplier":null,"curriculum_codes":["N-3-4"],"manual_required":true,"education_review":"pending"},{"id":"P03","facet":"facts","source_task":"概念-facts","role":"來源概念任務，作教學審查；不是獨立精熟","prompt":"要把54張貼紙每6張分一組。不先列直式，自己用幾個一數或乘法找組數，寫除法，再說為何這個乘法可找商。","answer":"6×9＝54，所以54÷6＝9","operands":[54,6],"quotient":9,"concept_multiplier":null,"curriculum_codes":["N-3-4"],"manual_required":true,"education_review":"pending"},{"id":"P05","facet":"contrast","source_task":"概念-contrast","role":"來源概念任務，作教學審查；不是獨立精熟","prompt":"甲要備8袋每袋7枚的徽章；乙已備56枚每袋7枚要裝袋。畫兩個量角色圖，分別列乘法與除法，說各自所求量。","answer":"甲8×7＝56求總量；乙56÷7＝8求袋數","operands":[56,7],"quotient":8,"concept_multiplier":56,"curriculum_codes":["N-3-4"],"manual_required":true,"education_review":"pending"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+(q.facet==='contrast'?'<label>甲的總數 <input class="product" type="text" inputmode="numeric" aria-label="第'+(i+1)+'題甲的總數"></label>':'')+'<label>'+(q.facet==='sharing'?'每人所得':q.facet==='contrast'?'乙的袋數':q.facet==='grouping'?'完整袋數':'組數')+' <input class="quotient" type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的數量"></label><button type="button">檢查數量</button><p class="feedback" role="status"></p><div class="print-only"><div>記錄分配、分組、算式與說明：</div><div class="notes"></div></div><label>記錄分配、分組、算式與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>單位、理由、圖形及實物操作需成人核對。</p></article>').join('');
document.querySelectorAll('article').forEach((el,i)=>{const fields=[...el.querySelectorAll('input')],f=el.querySelector('.feedback');fields.forEach(x=>x.oninput=()=>{f.textContent=''});el.querySelector('button').onclick=()=>{const v=fields.map(x=>x.value.trim());if(v.some(x=>!/^\d+$/.test(x))){f.textContent='請填入數字後再檢查。';return}const q=items[i],correct=q.facet==='contrast'?Number(v[0])===q.concept_multiplier&&Number(v[1])===q.quotient:Number(v[0])===q.quotient;f.textContent=correct?'數量正確；單位、算式、說明與實物仍請成人核對。':'數量需要再檢查；請重看題意和分組。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
