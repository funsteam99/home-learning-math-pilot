<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級｜第 30 單元：平面分割與重組（紙筆10題、實作6項）（試用版）</title><style>
/* Layout: controls on top; each practice sheet is a paper-like card of two question columns.
   Palette: warm paper neutrals with one deep-blue accent; red reserved for answers. */
:root {
  --bg: #f4f2ec;
  --fg: #1c2330;
  --muted: #5f6772;
  --card: #ffffff;
  --line: #d6d0c2;
  --accent: #2d5b86;
  --on-accent: #ffffff;
  --ans: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
    --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
  --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.row[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label { font-size: 14px; color: var(--muted); }
select, input[type="number"] {
  font: inherit;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  min-width: 0;
}
select { flex: 1 1 220px; max-width: 100%; }
input[type="number"] { width: 150px; max-width: 100%; }
.btn {
  font: inherit;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--fg); font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

.page {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-top: 16px;
}
.page-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
  font-size: 13px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.page-head h2 { grid-column: 1 / -1; margin: 0 0 2px; }
.fill { display: inline-block; min-width: 4em; border-bottom: 1px solid var(--line); }
.page-foot {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--rows), auto);
  column-gap: 22px;
  row-gap: 2px;
}
.q { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; font-size: 16px; }
.no { width: 2.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.pt { min-width: 0; overflow-wrap: anywhere; }
.blank { flex: 1 1 36px; min-width: 36px; border-bottom: 1px solid var(--line); height: 1.2em; }
.ans { display: none; color: var(--ans); font-weight: 700; flex: none; }
.show-ans .ans { display: inline; }
.pic .q { min-height: 84px; }
.pic svg { flex: none; width: 96px; height: 80px; color: var(--fg); }

.key {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 4px 12px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.mastery ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.mastery li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; }
.mastery li .q { min-height: 0; }
.mastery input {
  font: inherit;
  width: 96px;
  min-height: 40px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}
.fix { color: var(--ans); font-weight: 700; display: none; }
.mastery li.wrong .fix { display: inline; }
.result { font-weight: 700; font-size: 16px; }

@media (max-width: 480px) {
  .page-head { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
}

@media print {
  :root:root {
    --bg: #ffffff; --fg: #000000; --muted: #333333; --card: #ffffff;
    --line: #777777; --accent: #000000; --on-accent: #ffffff; --ans: #000000;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  body { padding: 0; background: #ffffff; color: #000000; }
  .wrap > h1, .lede, .panel, .mastery, .note { display: none !important; }
  .page { border: 0; border-radius: 0; margin: 0; padding: 0; break-after: page; }
  .page:last-of-type { break-after: auto; }
  .page-head { margin-bottom: 6px; padding-bottom: 6px; }
  .grid { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); row-gap: 0; }
  .text .q { height: 5.9mm; min-height: 0; font-size: 12pt; }
  .pic .q { height: 25mm; min-height: 0; font-size: 12pt; }
  .pic svg { width: 26mm; height: 22mm; }
  .page-foot { font-size: 9pt; }
  .answers { break-before: page; }
  .answers[hidden] { display: block !important; }
  .show-ans .ans { display: inline !important; }
}

20261113.html">第 8 單元：有餘數的除法（另有20題改編候選）</option><option value="g3-direct-u09-draft-20261113.html">第 9 單元：除法直式（另有20題改編候選）</option><option value="g3-direct-u10-draft-20261113.html">第 10 單元：含 0 的除法直式（另有20題改編候選）</option><option value="g3-direct-u11-draft-20261113.html">第 11 單元：兩步驟連乘（另有20題改編候選）</option><option value="g3-direct-u12-draft-20261113.html">第 12 單元：加減與除的兩步驟（另有20題改編候選）</option><option value="g3-direct-u13-draft-20261113.html">第 13 單元：生活四則估算與合理性（另有20題改編候選）</option><option value="g3-direct-u14-draft-20261113.html">第 14 單元：單位分數點數與同分母比較（45題候選）</option><option value="g3-direct-u15-draft-20261113.html">第 15 單元：同分母加減及和等於1（45題候選）</option><option value="g3-direct-u16-draft-20261113.html">第 16 單元：大於1至2的分數活動（25題候選）</option><option value="g3-direct-u17-draft-20261113.html">第 17 單元：十分位與一位小數比較（23題候選）</option><option value="g3-direct-u18-draft-20261113.html">第 18 單元：一位小數直式加減與解題（25題候選）</option><option value="g3-direct-u19-draft-20261113.html">第 19 單元：從0開始的整數數線報讀標示（30題候選）</option><option value="g3-direct-u20-draft-20261113.html">第 20 單元：數線比較與加減（30題候選）</option><option value="g3-direct-u21-draft-20261113.html">第 21 單元：毫米實測估測與長度換算（19題候選）</option><option value="g3-direct-u22-draft-20261113.html">第 22 單元：角的操作比較與直角（25題候選）</option><option value="g3-direct-u23-draft-20261113.html">第 23 單元：平方公分實測與方格點數面積（28題候選）</option><option value="g3-direct-u24-draft-20261113.html">第 24 單元：公升毫升實測估測與換算加減（44題候選）</option><option value="g3-direct-u25-draft-20261113.html">第 25 單元：公斤公克實測估測與換算加減（44題候選）</option><option value="g3-direct-u26-draft-20261113.html">第 26 單元：日時分秒的實測與換算（30題候選）</option><option value="g3-direct-u27-draft-20261113.html">第 27 單元：同單位時間及時分無進退位加減（25題候選）</option><option value="g3-direct-u28-draft-20261113.html">第 28 單元：正長方形邊角特徵與斜擺辨認（20題候選）</option><option value="g3-direct-u29-draft-20261113.html">第 29 單元：圓心半徑直徑與圓規作圖（24題候選）</option><option value="g3-direct-u30-draft-20261113.html" selected>第 30 單元：平面分割與重組（紙筆10題、實作6項）</option><option value="g3-direct-u31-draft-20261113.html">第 31 單元：展開圖與立體形體（紙筆10題、實作4項）</option><option value="g3-direct-u32-draft-20261113.html">第 32 單元：一維模式觀察、操作與說明（29題候選）</option><option value="g3-direct-u33-draft-20261113.html">第 33 單元：生活一維二維表格報讀（35題候選）</option><option value="g3-direct-u34-draft-20261113.html">第 34 單元：表格製作與模式呈現（16題候選）</option><option value="g3-direct-u35-draft-20261113.html">第 35 單元：全年綜合複習與必要操作確認（52題候選）</option></select></div><div class="row"><label for="seed">練習編號</label><input id="seed" type="number" min="1" max="2147483646" value="1"><button class="btn" id="new" type="button">產生新練習單</button><button class="btn ghost" id="show" type="button">依編號重新產生</button></div><div class="row"><label class="check"><input id="showAns" type="checkbox">顯示參考答案</label><label class="check"><input id="showKey" type="checkbox">顯示答案頁</label></div><p>編號只重排現有 6 題；切換單元或重新產生會清除作答。</p><strong>試用／審查中：2 題來源與 4 題改編實作候選，不是完整單元或精熟。</strong><p>必須實際剪、移動、重組並保留作品；畫面與列印未校準尺寸，作答記錄不代表實作完成。</p></section><div id="questions"></div><section class="page controls"><button class="btn" id="checkAnswered" type="button">批改已作答題目</button><p id="summary" role="status"></p><p>實測、方法及題意均由成人確認。</p></section></main><script>const SOURCE=[{"id":"P01","cut":"midline","prompt":"先描保留完整原圖，親自剪下一整張方形，再選沿一條對角線或中線剪成兩片。把兩片移動分開，再放回原圖核對不漏片。","answer":"有原圖、兩片實際剪件與重放作品；兩片合回原圖不重疊不留缺口"},{"id":"P02","cut":"diagonal","prompt":"親自把圖剪成兩片，重組一個與原來外形不同的作品，再將所有片移回原形。保留兩種作品，指出所有原片是否都用到；不作知識歸納。","answer":"有不同外形的實際重組與合回原形；使用同兩片，不重疊或漏片"},{"id":"ADAPTED-01","cut":"cross","origin":"來源題概念改編（待審）","sourceReference":"P01/P02","prompt":"描下正方形原圖，沿兩條中線剪成四片。先拼回原圖，再試著用四片排成長條長方形；保留兩種作品。","answer":"四片均使用，拼回及長條均無重疊或缺口；實作由成人確認。"},{"id":"ADAPTED-02","cut":"cross","origin":"來源題概念改編（待審）","sourceReference":"P01/P02","prompt":"沿兩條中線把正方形剪成四片，用全部四片邊對邊拼出一個L形，再拼回原圖；記錄每一片的位置。","answer":"四片都使用、邊相接、不重疊，且能拼回原圖；實作由成人確認。"},{"id":"ADAPTED-03","cut":"diagonal","origin":"來源題概念改編（待審）","sourceReference":"P01","prompt":"沿正方形對角線剪成兩片，把一片翻面後疊在另一片上，檢查邊與角是否對齊；最後拼回原圖。","answer":"兩片疊合邊角對齊；翻面、疊合與拼回由成人確認。"},{"id":"ADAPTED-04","cut":"horizontal","origin":"來源題概念改編（待審）","sourceReference":"P01","prompt":"沿正方形水平中線剪成兩片，把兩片重疊比較後，再用全部剪件拼回原圖。記錄兩片的形狀與比較方式。","answer":"兩片都是長方形，可疊合；剪件與比較由成人確認。"}];
'use strict';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(items,seed){let a=items.slice(),s=seed>>>0;for(let i=a.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;let j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function integer(x){let s=String(x).normalize('NFKC').trim();return /^\d{1,6}$/.test(s)?Number(s):NaN}
function question(q,i){let diagram='<svg class="cut-diagram" viewBox="0 0 160 160" role="img" aria-label="正方形示意圖，虛線是可選剪線"><rect x="20" y="20" width="120" height="120" fill="#fff" stroke="#111" stroke-width="2"/><path d="'+(q.cut==='midline'?'M80 20 V140':q.cut==='horizontal'?'M20 80 H140':q.cut==='cross'?'M80 20 V140 M20 80 H140':'M20 20 L140 140')+'" stroke="#444" stroke-width="2" stroke-dasharray="6 4"/></svg>';return '<article class="item" data-id="'+esc(q.id)+'"><strong>'+(i+1)+'. </strong>'+(q.origin?'<span class="note">'+esc(q.origin)+'</span>':'')+'<p>'+esc(q.prompt)+'</p>'+diagram+'<p class="note">圖為示意，列印尺寸未校準；可自行在紙上畫正方形，剪、移、拼後保留作品。</p><label>記錄剪線、剪件、拼回及作品 <textarea class="work" aria-label="記錄剪線、兩片、拼回及作品"></textarea></label> <button class="check controls" type="button">檢查填寫</button><p class="feedback" role="status"></p><div class="answer" hidden>成人參考：'+esc(q.answer)+'</div></article>'}
function render(items,n){$('#questions').innerHTML='<section class="page"><div class="page-head"><h2>第 30 單元：平面分割重組的實作</h2><span>練習編號 '+esc(n)+'　｜　'+items.length+' 題候選</span></div><div class="question-list">'+items.map(question).join('')+'</div></section><section class="page key" id="key" hidden><h2>家長參考答案</h2>'+items.map((q,i)=>'<p>'+(i+1)+'. '+esc(q.answer)+'</p>').join('')+'</section>';document.querySelectorAll('#questions article').forEach((card,i)=>{let q=items[i],f=card.querySelector('.feedback');card.querySelectorAll('input,textarea').forEach(x=>x.oninput=()=>f.textContent='');card.querySelector('.check').onclick=()=>{let value=card.querySelector('.work').value;if(!value.trim()){f.textContent='請先記錄實際操作。';return}f.textContent='已記錄；實際剪件、重組、拼回與說明須真人確認。'}});toggle()}
function toggle(){document.querySelectorAll('#questions .answer').forEach(x=>x.hidden=!$('#showAns').checked);let key=$('#key');if(key)key.hidden=!$('#showKey').checked}$('#showAns').onchange=toggle;$('#showKey').onchange=toggle;$('#show').onclick=()=>{let n=Number($('#seed').value);if(!Number.isSafeInteger(n)||n<1||n>2147483646){alert('請輸入 1 至 2147483646 的練習編號。');return}$('#summary').textContent='';render(shuffle(SOURCE,n),n)};$('#new').onclick=()=>{$('#seed').value=1+Math.floor(Math.random()*2147483645);$('#show').click()};$('#checkAnswered').onclick=()=>{let n=0;document.querySelectorAll('#questions article').forEach(card=>{if([...card.querySelectorAll('input,textarea')].some(x=>x.value.trim())){n++;card.querySelector('.check').click()}});$('#summary').textContent='已處理 '+n+' 題填寫或紀錄；真實剪件、重組與說明請成人確認。'};$('#show').click();
