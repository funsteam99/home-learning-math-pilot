<style>

ound:var(--teal);color:white;border:0;border-radius:5px;padding:8px 17px;cursor:pointer}button.secondary{background:transparent;color:var(--teal);border:1px solid var(--teal)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #d2764e;outline-offset:3px}.question{padding:20px 0 4px}.equation{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:clamp(1.8rem,5vw,2.5rem);font-weight:700;letter-spacing:.04em;margin:12px 0 18px}.equation input{font-size:1.6rem;width:110px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.result{min-height:2em;font-weight:700;color:#95482f}.other{margin-top:36px}.links{display:flex;gap:12px 22px;flex-wrap:wrap}.links a{color:#164f49;text-underline-offset:4px}.foot{font-size:.9rem;margin-top:36px;border-top:1px solid var(--line);padding-top:14px}.z{display:inline-flex;align-items:center;vertical-align:middle;white-space:nowrap;line-height:1.1;margin-right:.08em}.z .han{display:block}.z .phon{writing-mode:vertical-rl;text-orientation:upright;font-size:max(.38em,9px);line-height:1;letter-spacing:-.12em;margin-left:.05em}.z .phon[aria-hidden=true]{user-select:none}@media(max-width:650px){.hero{grid-template-columns:1fr;padding-top:32px}.sun{display:none}.grades{grid-template-columns:1fr;gap:7px}.grade{display:grid;grid-template-columns:5em 1fr auto;align-items:center;gap:8px;padding:10px 12px;min-height:68px}.grade strong{font-size:1.1rem}.z .phon{font-size:max(.38em,9px)}.seed{width:100%}}@media print{.top,.grades,.seed,.links,.other,.foot,button{display:none}.practice{border:0;padding:0}.hero{padding:0}.question{break-inside:avoid}}
</style></head><body><main>
<div class="top"><div class="brand" data-z>社子基金會</div><span class="badge" data-z>注音展示版</span></div>
<section class="hero"><div><div class="eyebrow">MATH · LEARN · GROW</div><h1 data-z>國小數學練習入口</h1><p class="intro" data-z>選好年級，一起來練習。</p></div><div class="sun" aria-hidden="true">＋</div></section>
<nav class="grades" aria-label="選擇年級"><button class="grade" data-grade="1" aria-pressed="true"><span class="number">GRADE 01</span><strong data-z>一年級</strong><span data-z>加法練習</span></button><button class="grade" data-grade="2" aria-pressed="false"><span class="number">GRADE 02</span><strong data-z>二年級</strong><span data-z>加法練習</span></button><button class="grade" data-grade="3" aria-pressed="false"><span class="number">GRADE 03</span><strong data-z>三年級</strong><span data-z>乘法練習</span></button></nav>
<section class="practice"><header><h2 id="grade-title" data-z>一年級練習</h2><div class="seed"><label for="seed" data-z>練習編號</label><input id="seed" type="number" min="1" max="9999" value="1"><button id="generate" class="action secondary" type="button" data-z>依編號出題</button></div></header><div class="question"><p data-z>計算，填入答案。</p><div class="equation"><span id="expression"></span><label for="answer" class="sr-only" data-z>答案</label><input id="answer" type="number" inputmode="numeric"></div><button id="check" class="action" type="button" data-z>檢查答案</button><p class="result" id="result" role="status"></p></div></section>
<section class="other"><h2 data-z>更多數學練習</h2><p data-z>展示版各年級各一題。其他單元請至原入口。</p><div class="links"><a href="index.html" data-z>一年級原入口</a><a href="g2-learning-u01-u04-v1.html" data-z>二年級原入口</a><a href="g3-trial.html" data-z>三年級原入口</a></div></section><footer class="foot" data-z>社子基金會 · 國小數學練習</footer>
</main><script>
'use strict';
const phon={'社':'ㄕㄜˋ','子':'ㄗˇ','基':'ㄐㄧ','金':'ㄐㄧㄣ','會':'ㄏㄨㄟˋ','注':'ㄓㄨˋ','音':'ㄧㄣ','展':'ㄓㄢˇ','示':'ㄕˋ','版':'ㄅㄢˇ','國':'ㄍㄨㄛˊ','小':'ㄒㄧㄠˇ','數':'ㄕㄨˋ','學':'ㄒㄩㄝˊ','練':'ㄌㄧㄢˋ','習':'ㄒㄧˊ','入':'ㄖㄨˋ','口':'ㄎㄡˇ','選':'ㄒㄩㄢˇ','好':'ㄏㄠˇ','年':'ㄋㄧㄢˊ','級':'ㄐㄧˊ','一':'ㄧˋ','起':'ㄑㄧˇ','來':'ㄌㄞˊ','二':'ㄦˋ','三':'ㄙㄢ','加':'ㄐㄧㄚ','法':'ㄈㄚˇ','乘':'ㄔㄥˊ','編':'ㄅㄧㄢ','號':'ㄏㄠˋ','依':'ㄧ','出':'ㄔㄨ','題':'ㄊㄧˊ','算':'ㄙㄨㄢˋ','填':'ㄊㄧㄢˊ','答':'ㄉㄚˊ','案':'ㄢˋ','檢':'ㄐㄧㄢˇ','查':'ㄔㄚˊ','更':'ㄍㄥˋ','多':'ㄉㄨㄛ','各':'ㄍㄜˋ','其':'ㄑㄧˊ','他':'ㄊㄚ','單':'ㄉㄢ','元':'ㄩㄢˊ','請':'ㄑㄧㄥˇ','至':'ㄓˋ','計':'ㄐㄧˋ','到':'ㄉㄠˋ','的':'˙ㄉㄜ','對':'ㄉㄨㄟˋ','了':'˙ㄌㄜ','原':'ㄩㄢˊ','正':'ㄓㄥˋ','確':'ㄑㄩㄝˋ','再':'ㄗㄞˋ','試':'ㄕˋ','試':'ㄕˋ','先':'ㄒㄧㄢ','寫':'ㄒㄧㄝˇ','下':'ㄒㄧㄚˋ','請':'ㄑㄧㄥˇ'};
function annotated(el){const text=el.textContent;el.setAttribute('aria-label',text);el.textContent='';for(const ch of text){if(!phon[ch]){el.append(document.createTextNode(ch));continue}const z=document.createElement('span');z.className='z';z.setAttribute('aria-hidden','true');const h=document.createElement('span');h.className='han';h.textContent=ch;const p=document.createElement('span');p.className='phon';p.setAttribute('aria-hidden','true');p.textContent=phon[ch];z.append(h,p);el.append(z)}}document.querySelectorAll('[data-z]').forEach(annotated);
let grade=1,expected=0;const $=s=>document.querySelector(s),banks={1:[[3,4],[5,2],[6,3],[4,4]],2:[[26,17],[38,24],[45,18],[57,26]],3:[[24,3],[36,2],[42,3],[31,4]]};function render(){let v=Number($('#seed').value);if(!Number.isInteger(v)||v<1||v>9999){$('#result').textContent='請填入 1 到 9999 的練習編號。';annotated($('#result'));return}let [a,b]=banks[grade][(v-1)%4];expected=grade===3?a*b:a+b;$('#expression').textContent=a+(grade===3?' × ':' ＋ ')+b+' ＝';$('#answer').value='';$('#result').textContent='';$('#grade-title').textContent=['','一年級練習','二年級練習','三年級練習'][grade];annotated($('#grade-title'))}document.querySelectorAll('[data-grade]').forEach(btn=>btn.addEventListener('click',()=>{grade=Number(btn.dataset.grade);document.querySelectorAll('[data-grade]').forEach(x=>x.setAttribute('aria-pressed',String(x===btn)));render()}));$('#generate').addEventListener('click',render);$('#answer').addEventListener('input',()=>$('#result').textContent='');$('#check').addEventListener('click',()=>{const v=$('#answer').value;$('#result').textContent=v===''?'請先填入答案。':Number(v)===expected?'答對了！':'再試試。';annotated($('#result'))});render();
</script></body></html>
