ctor('#showKey').onchange=e=>key.hidden=!e.target.checked;sheet.querySelectorAll('article').forEach((el,i)=>{let input=el.querySelector('input'),f=el.querySelector('.feedback');input.oninput=()=>f.textContent='';el.querySelector('button').onclick=()=>{let v=input.value.trim();f.textContent=!/^\d+$/.test(v)?'請用數字填寫。':Number(v)===qs[i].params.number/10000?'數字正確；單位和讀數請成人確認。':'請再檢查數字。'}});</script></body></html>
