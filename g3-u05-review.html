<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第5單元乘法審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:#fff;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea{font:inherit;padding:8px}button{min-height:42px}textarea{display:block;width:95%;min-height:5em}label{display:block;margin-top:8px}summary{cursor:pointer;color:#184f70;min-height:42px;font-weight:bold}.grid{border-collapse:collapse;margin:8px 0;max-width:100%;table-layout:fixed}.grid th,.grid td{border:1px solid #888;text-align:center;padding:3px}.grid th:first-child{width:5.8em}.grid input{box-sizing:border-box;width:2.7em;max-width:100%;padding:5px;text-align:center}.grid caption{text-align:left;font-weight:bold}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,.group-section,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.paper{border-collapse:collapse;margin:3mm 0}.paper th,.paper td{border:1px solid #000;width:13mm;height:8mm;text-align:center}.paper th:first-child{width:24mm}.notes{height:25mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第5單元：二三位數乘一位數</h1><section class="controls"><strong>公開審查稿：4題來源候選，屬同類練習；不是完整教材或精熟測驗。</strong><p>依題意用實物或紙上記錄每組的量，再連到一列乘法直式。按鈕只檢查積；組數、位值、交換、連線、提示及實物活動由成人核對。第一題原題允許成人示範第一步，不能視為獨立測量。重新整理清除作答；列印為空白卷。教育、手機及列印尚待確認。</p><label><input type="checkbox" id="showKey">顯示家長答案頁</label></section><p class="print-only">公開審查稿：4題來源候選，非完整教材或精熟。請依題意使用實物並由成人核對位值、直式及提示。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>積正確仍須核對每組數量、位值、交換、說明及實物操作；第1題允許示範第一步，需記錄提示。</p></section></main><script>
const items=[{"id":"PG01","facet":"algorithm","prompt":"每組269，共4組。先在千百十個表記每組的量，再把所有組的量合起，將每個位連到一列積的直式。成人可示範第一步，但記提示後讓孩子完成。","answer":"269×4＝1076","operands":[269,4],"product":1076,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_real_operation":true,"notes":"原題允許成人示範，須記提示，不能視為獨立作答。","parent_steps":"個位：9×4＝36，寫6，向十位進3；十位：6×4＋進位3＝27，寫7，向百位進2；百位：2×4＋進位2＝10，寫0，向千位進1；將進位1寫在千位。"},{"id":"PA01","facet":"algorithm","prompt":"每組346，共7組。先在千百十個表記每組的量，再把所有組的量合起，將每個位連到一列積的直式。","answer":"346×7＝2422","operands":[346,7],"product":2422,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_real_operation":true,"notes":"材料單位與表徵仍須教育審查。","parent_steps":"個位：6×7＝42，寫2，向十位進4；十位：4×7＋進位4＝32，寫2，向百位進3；百位：3×7＋進位3＝24，寫4，向千位進2；將進位2寫在千位。"},{"id":"PB01","facet":"algorithm","prompt":"每組479，共3組。先在千百十個表記每組的量，再把所有組的量合起，將每個位連到一列積的直式。把材料記錄翻譯為直式，圈兩份作品同一位的量。","answer":"479×3＝1437","operands":[479,3],"product":1437,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_real_operation":true,"notes":"材料單位與表徵仍須教育審查。","parent_steps":"個位：9×3＝27，寫7，向十位進2；十位：7×3＋進位2＝23，寫3，向百位進2；百位：4×3＋進位2＝14，寫4，向千位進1；將進位1寫在千位。"},{"id":"PC01","facet":"algorithm","prompt":"每組137，共4組。先在千百十個表記每組的量，再把所有組的量合起，將每個位連到一列積的直式。","answer":"137×4＝548","operands":[137,4],"product":548,"curriculum_codes":["N-3-3"],"source_educational_status":"pending","requires_real_operation":true,"notes":"材料單位與表徵仍須教育審查。","parent_steps":"個位：7×4＝28，寫8，向十位進2；十位：3×4＋進位2＝14，寫4，向百位進1；百位：1×4＋進位1＝5，寫5。"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function groupTable(q,i,paper=false){const places=['千','百','十','個'],rows=Array.from({length:q.operands[1]},(_,j)=>'第'+(j+1)+'組').concat('合起來');return '<table class="'+(paper?'paper':'grid')+'"><caption>第'+(i+1)+'題空白組數位值表</caption><thead><tr><th scope="col">記錄</th>'+places.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th scope="row">'+r+'</th>'+places.map(c=>'<td>'+(paper?'':'<input type="text" inputmode="numeric" maxlength="2" aria-label="第'+(i+1)+'題'+r+c+'位">')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>填寫積 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的積"></label><button type="button">檢查積</button><p class="feedback" role="status"></p><details class="group-section"><summary>展開空白組數位值表</summary><p>各組和合起來的記錄供成人核對；交換、連線及實物操作另行確認。</p>'+groupTable(q,i)+'</details><div class="print-only">'+groupTable(q,i,true)+'<div>一列直式及說明：</div><div class="notes"></div></div><label>記錄直式、交換與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><p>位值、直式、說明和實物操作需成人核對。</p></article>').join('');
document.querySelectorAll('article').forEach((el,i)=>{const input=el.querySelector('input'),feedback=el.querySelector('.feedback');input.oninput=()=>{feedback.textContent=''};el.querySelector('button').onclick=()=>{const s=input.value.trim();feedback.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].product?'積正確；其他要求仍請成人核對。':'積需要再檢查；請檢視每一位。'}});
document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'；每組'+q.operands[0]+'，共'+q.operands[1]+'組。'+(q.id==='PG01'?'原題可示範第一步，請記錄提示。':'')+'<br>'+esc(q.parent_steps)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
