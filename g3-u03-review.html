<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第3單元加法直式審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea{font:inherit;padding:8px}textarea{display:block;width:95%;min-height:5em}.cols{font:1.4em/1.4 monospace;display:grid;width:max-content;grid-template-columns:1.2em 4ch;text-align:right}.cols .line{grid-column:1 / 3;border-top:1px solid}button{min-height:42px}label{display:block;margin-top:8px}.feedback{font-weight:bold}.key[hidden]{display:none}@media print{.key{break-before:page}}@media print{button,.controls,.feedback{display:none}.key[hidden]{display:none}article{break-inside:avoid;border:0}}.place-grid{border-collapse:collapse;margin:.5em 0;max-width:100%;table-layout:fixed}.place-grid th,.place-grid td{border:1px solid #aaa;text-align:center;padding:3px}.place-grid th:first-child{width:5.8em}.place-grid input{box-sizing:border-box;width:2.7em;max-width:100%;padding:5px;text-align:center}.place-grid caption{text-align:left;font-weight:bold}details.grid-section{margin:12px 0}details.grid-section summary{cursor:pointer;color:#184f70;font-weight:bold;min-height:42px}.print-only{display:none}@media print{.print-only{display:block}.align-hint,.hint-status,.grid-section,article>label,article>p{display:none!important}article{break-inside:avoid;page-break-inside:avoid;border:0;padding:4mm 0}.print-grid{border-collapse:collapse;margin:3mm 0}.print-grid th,.print-grid td{border:1px solid #000;width:13mm;height:8mm;text-align:center}.print-grid th:first-child{width:24mm}.print-notes{height:20mm;border:1px solid #000}.print-intro{font-size:10pt}}</style></head><body><main class="wrap"><h1>三年級第3單元：多次進位直式加法</h1><section class="controls"><strong>公開審查稿：僅12題來源候選，不是完整教材或精熟測驗。</strong><p>請在紙上或下方記錄區列直式及進位，依題意圈出0或說明；按鈕僅檢查輸入的總和，對位、進位、理由與材料操作須由成人確認。重新整理不保留作答和提示紀錄；列印為空白練習卷，不包含網頁作答；畫線、圈選及實物活動請在紙上或使用實物完成；教育審查、手機及列印尚待確認。</p><label><input type="checkbox" id="showKey">顯示家長答案頁</label></section><p class="print-only print-intro">公開審查稿：12題來源候選，非完整教材或精熟測驗。請依題意填寫並由成人核對對位、進位、理由與實物操作。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2></section></main><script>const items=[{"id":"PG01","facet":"algorithm","prompt":"對4678＋1569，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。","answer":"4678＋1569＝6247；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[4678,1569],"sum":6247,"manual_required":true,"carry_explanation":"個位：8＋9＝17，寫7，向十位進1；十位：7＋6＋進位1＝14，寫4，向百位進1；百位：6＋5＋進位1＝12，寫2，向千位進1；千位：4＋1＋進位1＝6，寫6。"},{"id":"PA01","facet":"algorithm","prompt":"對3978＋1865，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。","answer":"3978＋1865＝5843；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[3978,1865],"sum":5843,"manual_required":true,"carry_explanation":"個位：8＋5＝13，寫3，向十位進1；十位：7＋6＋進位1＝14，寫4，向百位進1；百位：9＋8＋進位1＝18，寫8，向千位進1；千位：3＋1＋進位1＝5，寫5。"},{"id":"PB01","facet":"algorithm","prompt":"對4867＋2938，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。把橫式、材料紀錄和直式對應的位用線連起。","answer":"4867＋2938＝7805；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[4867,2938],"sum":7805,"manual_required":true,"carry_explanation":"個位：7＋8＝15，寫5，向十位進1；十位：6＋3＋進位1＝10，寫0，向百位進1；百位：8＋9＋進位1＝18，寫8，向千位進1；千位：4＋2＋進位1＝7，寫7。"},{"id":"PC01","facet":"algorithm","prompt":"對1587＋2698，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。寫一句理由供另一位記錄員核對，不只抄結果。","answer":"1587＋2698＝4285；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[1587,2698],"sum":4285,"manual_required":true,"carry_explanation":"個位：7＋8＝15，寫5，向十位進1；十位：8＋9＋進位1＝18，寫8，向百位進1；百位：5＋6＋進位1＝12，寫2，向千位進1；千位：1＋2＋進位1＝4，寫4。"},{"id":"PG03","facet":"zero","prompt":"計算5098＋1847並留下每步進退位。把沒有材料的一位仍留在表中。圈出0所在的位，說它如何參與計算。","answer":"5098＋1847＝6945；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[5098,1847],"sum":6945,"manual_required":true,"carry_explanation":"個位：8＋7＝15，寫5，向十位進1；十位：9＋4＋進位1＝14，寫4，向百位進1；百位：0＋8＋進位1＝9，寫9；千位：5＋1＝6，寫6。"},{"id":"PA03","facet":"zero","prompt":"計算6089＋1726並留下每步進退位。把沒有材料的一位仍留在表中。圈出0所在的位，說它如何參與計算。","answer":"6089＋1726＝7815；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[6089,1726],"sum":7815,"manual_required":true,"carry_explanation":"個位：9＋6＝15，寫5，向十位進1；十位：8＋2＋進位1＝11，寫1，向百位進1；百位：0＋7＋進位1＝8，寫8；千位：6＋1＝7，寫7。"},{"id":"PB03","facet":"zero","prompt":"計算7028＋1846並留下每步進退位。把沒有材料的一位仍留在表中。把橫式、材料紀錄和直式對應的位用線連起。圈出0所在的位，說它如何參與計算。","answer":"7028＋1846＝8874；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[7028,1846],"sum":8874,"manual_required":true,"carry_explanation":"個位：8＋6＝14，寫4，向十位進1；十位：2＋4＋進位1＝7，寫7；百位：0＋8＝8，寫8；千位：7＋1＝8，寫8。"},{"id":"PC03","facet":"zero","prompt":"計算8036＋957並留下每步進退位。把沒有材料的一位仍留在表中。寫一句理由供另一位記錄員核對，不只抄結果。圈出0所在的位，說它如何參與計算。","answer":"8036＋957＝8993；完整同位直式及逐位交換證據符合此算式","context_unit":null,"operands":[8036,957],"sum":8993,"manual_required":true,"carry_explanation":"個位：6＋7＝13，寫3，向十位進1；十位：3＋5＋進位1＝9，寫9；百位：0＋9＝9，寫9；千位：8＋0＝8，寫8。"},{"id":"PG04","facet":"meaning","prompt":"倉庫原有1785張卡，另收到2689張。要更新庫存標籤。用1785＋2689列直式求結果，寫單位並說每個數的角色。","answer":"1785＋2689＝4474；完整同位直式及逐位交換證據符合此算式","context_unit":"張","operands":[1785,2689],"sum":4474,"manual_required":true,"carry_explanation":"個位：5＋9＝14，寫4，向十位進1；十位：8＋8＋進位1＝17，寫7，向百位進1；百位：7＋6＋進位1＝14，寫4，向千位進1；千位：1＋2＋進位1＝4，寫4。"},{"id":"PA04","facet":"meaning","prompt":"倉庫原有2486張卡，另收到1978張。要更新庫存標籤。用2486＋1978列直式求結果，寫單位並說每個數的角色。","answer":"2486＋1978＝4464；完整同位直式及逐位交換證據符合此算式","context_unit":"張","operands":[2486,1978],"sum":4464,"manual_required":true,"carry_explanation":"個位：6＋8＝14，寫4，向十位進1；十位：8＋7＋進位1＝16，寫6，向百位進1；百位：4＋9＋進位1＝14，寫4，向千位進1；千位：2＋1＋進位1＝4，寫4。"},{"id":"PB04","facet":"meaning","prompt":"倉庫原有3796張卡，另收到2487張。要更新庫存標籤。把橫式、材料紀錄和直式對應的位用線連起。用3796＋2487列直式求結果，寫單位並說每個數的角色。","answer":"3796＋2487＝6283；完整同位直式及逐位交換證據符合此算式","context_unit":"張","operands":[3796,2487],"sum":6283,"manual_required":true,"carry_explanation":"個位：6＋7＝13，寫3，向十位進1；十位：9＋8＋進位1＝18，寫8，向百位進1；百位：7＋4＋進位1＝12，寫2，向千位進1；千位：3＋2＋進位1＝6，寫6。"},{"id":"PC04","facet":"meaning","prompt":"倉庫原有2684張卡，另收到1958張。要更新庫存標籤。寫一句理由供另一位記錄員核對，不只抄結果。用2684＋1958列直式求結果，寫單位並說每個數的角色。","answer":"2684＋1958＝4642；完整同位直式及逐位交換證據符合此算式","context_unit":"張","operands":[2684,1958],"sum":4642,"manual_required":true,"carry_explanation":"個位：4＋8＝12，寫2，向十位進1；十位：8＋5＋進位1＝14，寫4，向百位進1；百位：6＋9＋進位1＝16，寫6，向千位進1；千位：2＋1＋進位1＝4，寫4。"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function placeGrid(i){const cols=['千','百','十','個'],rows=['進位記錄','第一個數','第二個數','結果'];const table=n=>'<table class="place-grid"><caption>第'+(i+1)+'題第'+n+'張空白位值表</caption><thead><tr><th scope="col">記錄</th>'+cols.map(c=>'<th scope="col">'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th scope="row">'+r+'</th>'+cols.map(c=>'<td><input type="text" inputmode="numeric" maxlength="1" aria-label="第'+(i+1)+'題第'+n+'張表'+r+c+'位"></td>').join('')+'</tr>').join('')+'</tbody></table>';return '<details class="grid-section"><summary>展開空白位值表</summary><p>依題意自行填寫；可留空，表內填寫及進位仍須成人核對。開啟對齊提示後應記錄已使用提示。</p>'+table(1)+(i<4?table(2):'')+'</details>'}function printGrid(i){const cols=['千','百','十','個'],rows=['進位記錄','第一個數','第二個數','結果'];const table=()=>'<table class="print-grid"><tr><th>記錄</th>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr><th>'+r+'</th>'+cols.map(()=>'<td></td>').join('')+'</tr>').join('')+'</table>';return '<div class="print-only">'+table()+(i<4?'<div>另一張空格表：</div>'+table():'')+'<div>直式、進位與說明：</div><div class="print-notes"></div></div>'}document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<details class="align-hint"><summary>查看對齊提示</summary><div class="cols" aria-label="對齊提示"><span></span><span>'+esc(q.operands[0])+'</span><span>+</span><span>'+esc(q.operands[1])+'</span><span class="line"></span></div></details><p class="hint-status" role="status">對齊提示：本次尚未開啟</p><label>填寫總和 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題總和"></label><button type="button">檢查總和</button><p class="feedback" role="status"></p>'+placeGrid(i)+printGrid(i)+'<label>記錄直式、進位及說明<textarea></textarea></label><p>直式每位對齊、進位、圈0及題目要求的說明／材料操作由成人核對。</p></article>').join('');document.querySelectorAll('article').forEach((el,i)=>{const hint=el.querySelector('.align-hint');hint.ontoggle=()=>{if(hint.open)el.querySelector('.hint-status').textContent='對齊提示：本次已開啟（收合後仍保留紀錄）'};el.querySelector('input').oninput=()=>{el.querySelector('.feedback').textContent=''};el.querySelector('button').onclick=()=>{const s=el.querySelector('input').value.trim(),feedback=el.querySelector('.feedback');feedback.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].sum?'總和正確；其他要求仍請成人核對。':'總和需要再檢查；請檢視每一位。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+(q.context_unit?'；情境單位：'+esc(q.context_unit):'')+'<br>'+esc(q.carry_explanation)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;</script></body></html>
