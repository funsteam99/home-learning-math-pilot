<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第3單元加法直式審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea{font:inherit;padding:8px}textarea{display:block;width:95%;min-height:5em}.cols{font:1.4em/1.4 monospace;white-space:pre}button{min-height:42px}label{display:block;margin-top:8px}.feedback{font-weight:bold}.key[hidden]{display:none}@media print{button,.controls,.feedback{display:none}.key[hidden]{display:none}article{break-inside:avoid;border:0}}</style></head><body><main class="wrap"><h1>三年級第3單元：多次進位直式加法</h1><section class="controls"><strong>公開審查稿：僅8題來源候選，不是完整教材或精熟測驗。</strong><p>請在紙上或下方記錄區列直式及進位，依題意圈出0或說明；按鈕僅檢查輸入的總和，對位、進位、理由與材料操作須由成人確認。重新整理不保留作答；教育審查、手機及列印尚待確認。</p><label><input type="checkbox" id="showKey">顯示家長答案頁</label></section><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2></section></main><script>const items=[{"id":"PG01","facet":"algorithm","prompt":"對4678＋1569，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。","answer":"4678＋1569＝6247；完整同位直式及逐位交換證據符合此算式","operands":[4678,1569],"sum":6247,"manual_required":true},{"id":"PA01","facet":"algorithm","prompt":"對3978＋1865，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。","answer":"3978＋1865＝5843；完整同位直式及逐位交換證據符合此算式","operands":[3978,1865],"sum":5843,"manual_required":true},{"id":"PB01","facet":"algorithm","prompt":"對4867＋2938，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。把橫式、材料紀錄和直式對應的位用線連起。","answer":"4867＋2938＝7805；完整同位直式及逐位交換證據符合此算式","operands":[4867,2938],"sum":7805,"manual_required":true},{"id":"PC01","facet":"algorithm","prompt":"對1587＋2698，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。寫一句理由供另一位記錄員核對，不只抄結果。","answer":"1587＋2698＝4285；完整同位直式及逐位交換證據符合此算式","operands":[1587,2698],"sum":4285,"manual_required":true},{"id":"PG03","facet":"zero","prompt":"計算5098＋1847並留下每步進退位。把沒有材料的一位仍留在表中。圈出0所在的位，說它如何參與計算。","answer":"5098＋1847＝6945；完整同位直式及逐位交換證據符合此算式","operands":[5098,1847],"sum":6945,"manual_required":true},{"id":"PA03","facet":"zero","prompt":"計算6089＋1726並留下每步進退位。把沒有材料的一位仍留在表中。圈出0所在的位，說它如何參與計算。","answer":"6089＋1726＝7815；完整同位直式及逐位交換證據符合此算式","operands":[6089,1726],"sum":7815,"manual_required":true},{"id":"PB03","facet":"zero","prompt":"計算7028＋1846並留下每步進退位。把沒有材料的一位仍留在表中。把橫式、材料紀錄和直式對應的位用線連起。圈出0所在的位，說它如何參與計算。","answer":"7028＋1846＝8874；完整同位直式及逐位交換證據符合此算式","operands":[7028,1846],"sum":8874,"manual_required":true},{"id":"PC03","facet":"zero","prompt":"計算8036＋957並留下每步進退位。把沒有材料的一位仍留在表中。寫一句理由供另一位記錄員核對，不只抄結果。圈出0所在的位，說它如何參與計算。","answer":"8036＋957＝8993；完整同位直式及逐位交換證據符合此算式","operands":[8036,957],"sum":8993,"manual_required":true}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<div class="cols" aria-label="算式">'+esc(String(q.operands[0]).padStart(5,' '))+'<br>＋'+esc(String(q.operands[1]).padStart(4,' '))+'<br>─────</div><label>填寫總和 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題總和"></label><button type="button">檢查總和</button><p class="feedback" role="status"></p><label>記錄直式、進位及說明<textarea></textarea></label><p>直式每位對齊、進位、圈0及題目要求的說明／材料操作由成人核對。</p></article>').join('');document.querySelectorAll('article').forEach((el,i)=>{el.querySelector('button').onclick=()=>{const s=el.querySelector('input').value.trim(),feedback=el.querySelector('.feedback');feedback.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].sum?'總和正確；其他要求仍請成人核對。':'總和需要再檢查；請檢視每一位。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;</script></body></html>
