<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第10單元含零除法審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:8em;font-family:monospace}.feedback{font-weight:bold}.digit-mark{margin:8px 0}.digit-mark button{min-width:42px;margin-right:4px}.digit-mark button[aria-pressed="true"]{border:2px solid #184f70;border-radius:50%;background:#e4f2f8}.step-grid{border-collapse:collapse;margin:8px 0;max-width:100%}.step-grid th,.step-grid td{border:1px solid #888;padding:3px;text-align:center}.step-grid th:first-child{width:5.8em}.step-grid input{width:4em;max-width:100%;padding:5px;text-align:center}summary{cursor:pointer;color:#184f70;font-weight:bold;min-height:42px}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,.steps,.digit-mark,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.notes{height:45mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第10單元：含0的除法直式</h1><section class="controls"><strong>公開審查稿：2題來源候選，屬同類直式練習；不是完整教材或精熟。</strong><p>可在網頁圈記或紙上圈出被除數的0，並在紙上或下方記錄區列直式，保留每次分、乘回、減和換單位。按鈕只檢查商；位值對齊、商位、過程、說明與實物操作須由成人核對。第1題原題允許示範第一步，請記錄協助，不能視為獨立測量。重新整理清除作答；列印為空白卷；教育、手機及列印待驗證。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">公開來源審查稿；非完整教材或精熟。請由成人核對直式步驟、位值與所需操作。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>逐位說明是一種核對方式，商正確仍須核對過程及材料；第1題請記錄是否有示範。</p></section></main><script>
const items=[{"id":"PG03","facet":"zero","prompt":"把609平均分成3組。圈被除數的0位，完成直式並指出商中沒有該單位時怎樣保留位置。成人可示範第一步，但記提示後讓孩子完成。","answer":"609÷3＝203","operands":[609,3],"quotient":203,"remainder":0,"curriculum_codes":["N-3-5"],"manual_required":true,"education_review":"pending","parent_steps":"百位：6÷3，商2；2×3＝6，6－6＝0；十位：0÷3，商0；0×3＝0，0－0＝0；個位：9÷3，商3；3×3＝9，9－9＝0。"},{"id":"PC03","facet":"zero","prompt":"把804平均分成4組。圈被除數的0位，完成直式並指出商中沒有該單位時怎樣保留位置。","answer":"804÷4＝201","operands":[804,4],"quotient":201,"remainder":0,"curriculum_codes":["N-3-5"],"manual_required":true,"education_review":"pending","parent_steps":"百位：8÷4，商2；2×4＝8，8－8＝0；十位：0÷4，商0；0×4＝0，0－0＝0；個位：4÷4，商1；1×4＝4，4－4＝0。"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stepGrid(i){const cols=['百','十','個'],rows=['分前數','商的數字','乘回','剩餘'];return '<table class="step-grid"><caption>第'+(i+1)+'題空白逐位記錄表</caption><thead><tr><th scope="col">記錄</th>'+cols.map(c=>'<th scope="col">'+c+'位</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th scope="row">'+r+'</th>'+cols.map(c=>'<td><input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題'+c+'位'+r+'"></td>').join('')+'</tr>').join('')+'</tbody></table>'}document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>填寫商 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的商"></label><button type="button">檢查商</button><p class="feedback" role="status"></p><div class="digit-mark">圈記被除數中的數字（成人核對）： '+String(q.operands[0]).split('').map((d,j)=>'<button type="button" class="digit" aria-pressed="false" aria-label="第'+(i+1)+'題被除數第'+(j+1)+'個數字'+d+'">'+d+'</button>').join('')+'</div><details class="steps"><summary>展開空白逐位記錄表</summary><p>依實際過程填寫；若較高位不寫商，可留空。表格內容由成人核對，不會自動判斷。</p>'+stepGrid(i)+'</details><div class="print-only"><div>直式、分配與說明：</div><div class="notes"></div></div><label>記錄直式、分配與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範第一步</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>協助紀錄由成人填寫，僅保留本頁；不能單憑選項判定獨立作答。直式及材料操作須由成人核對。</p></article>').join('');document.querySelectorAll('article').forEach((el,i)=>{const input=el.querySelector('input'),f=el.querySelector('.feedback');input.oninput=()=>{f.textContent=''};el.querySelectorAll('.digit').forEach(b=>{b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')});el.querySelector('button').onclick=()=>{const s=input.value.trim();f.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].quotient?'商正確；其他要求仍請成人核對。':'商需要再檢查；請檢視每一步。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'<br>'+esc(q.parent_steps)+(q.id==='PG03'?'<br>原題允許示範第一步，請記錄協助。':'')+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
