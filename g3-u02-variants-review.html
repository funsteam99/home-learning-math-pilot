// Array order: ten-thousands, thousands, hundreds, tens, ones. Intermediate counts may exceed 9.
function valid(a){return Array.isArray(a)&&a.length===5&&a.every(n=>Number.isInteger(n)&&n>=0&&n<=99)}
function total(a){if(!valid(a))throw Error('invalid pieces');return a.reduce((s,n,i)=>s+n*[10000,1000,100,10,1][i],0)}
function exchange(a,index,direction){if(!valid(a)||!Number.isInteger(index)||index<0||index>3||![-1,1].includes(direction))throw Error('invalid input');let b=a.slice();if(direction===1){if(b[index]<1||b[index+1]>89)return null;b[index]--;b[index+1]+=10}else{if(b[index+1]<10||b[index]>=99)return null;b[index]++;b[index+1]-=10}if(total(a)!==total(b))throw Error('total changed');return b}

return {valid,total,exchange}})();

function blockIcon(i){let grid='<rect x="0" y="0" width="20" height="20" fill="white" stroke="black" stroke-width=".6"/>'+Array.from({length:9},(_,j)=>'<path d="M'+((j+1)*2)+' 0v20M0 '+((j+1)*2)+'h20" stroke="black" stroke-width=".25"/>').join('');if(i===0)return '<svg width="58" height="58" viewBox="0 0 60 60" aria-hidden="true">'+Array.from({length:10},(_,j)=>'<g transform="translate('+(j*3)+','+(j*3)+')">'+grid+'</g>').join('')+'</svg>';if(i===1)return '<svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true">'+grid+'</svg>';if(i===2)return '<svg width="12" height="30" viewBox="0 0 4 20" aria-hidden="true"><rect x="1" y="0" width="2" height="20" fill="white" stroke="black" stroke-width=".4"/>'+Array.from({length:9},(_,j)=>'<path d="M1 '+((j+1)*2)+'h2" stroke="black" stroke-width=".3"/>').join('')+'</svg>';return '<svg width="10" height="10" viewBox="0 0 2 2" aria-hidden="true"><rect width="2" height="2" fill="black"/></svg>'}

function given(q){if(q.source_id==='X01')return '<p>題目給的記錄：6 條十條</p><div class="icons" role="img" aria-label="六條十條">'+blockIcon(2).repeat(6)+'</div>';if(q.source_id==='X02')return '<p>題目給的材料：</p><div class="given-state">'+[5,12,4,2].map((n,i)=>'<div class="piece">'+['千','百','十','個'][i]+'：'+n+' 件<div class="icons" aria-hidden="true">'+blockIcon(i).repeat(n)+'</div></div>').join('')+'</div>';if(q.source_id==='R02')return '<p>題目中的原寫法：<span class="piece">7006</span> 寫成 <span class="piece">76</span></p>';return ''}
function card(q,i){return `<article class="question"><strong>${i+1}. </strong><span>${esc(q.prompt)}</span>${given(q)}<p class="note">依題意自行取出材料；需要交換時，使用按鈕每次交換相鄰一階。</p><div class="state" aria-label="目前材料"></div><div class="actions">${['萬','千','百','十','個'].map((name,j)=>'<button type="button" data-piece="'+j+'" data-delta="1">取出 1 '+name+'</button><button type="button" data-piece="'+j+'" data-delta="-1">放回 1 '+name+'</button>').join('')}</div><div class="actions">${['萬','千','百','十'].map((x,j)=>'<button type="button" data-index="'+j+'" data-direction="1">1'+x+' 換 10'+['千','百','十','個'][j]+'</button><button type="button" data-index="'+j+'" data-direction="-1">10'+['千','百','十','個'][j]+' 換 1'+x+'</button>').join('')}<button type="button" class="reset">清空材料</button><button type="button" class="save-step">記錄目前材料</button><button type="button" class="clear-steps">清除步驟紀錄</button></div><ol class="step-log" aria-label="已記錄的操作步驟"></ol><p class="feedback" role="status"></p><label>記錄你的步驟及理由<textarea></textarea></label><p class="answer" hidden>家長參考：${esc(q.answer)}；請核對每一步操作及說明。</p></article>`}

document.querySelectorAll('.question').forEach((el,i)=>{let original=[0,0,0,0,0],state=original.slice(),steps=[],feedback=el.querySelector('.feedback');function render(){el.querySelector('.state[aria-label="目前材料"]').innerHTML=['萬','千','百','十','個'].map((name,j)=>'<span class="piece">'+name+'：'+state[j]+' 件 <span class="icons" aria-hidden="true">'+(j===0?'<span class="ten-thousand">1萬＝10千</span>'.repeat(state[j]):blockIcon(j-1).repeat(state[j]))+'</span></span>').join('')}el.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{let j=Number(b.dataset.piece),next=state.slice();next[j]+=Number(b.dataset.delta);if(!model.valid(next)||model.total(next)>10000){feedback.textContent='材料不足或數量超出一萬範圍。';return}state=next;feedback.textContent='已調整材料。';render()});el.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{let next=model.exchange(state,Number(b.dataset.index),Number(b.dataset.direction));if(!next){feedback.textContent='材料不足，或交換後件數超過此示意工具範圍。';return}state=next;feedback.textContent='已完成交換，請自行比較總量。';render()});el.querySelector('.reset').onclick=()=>{state=original.slice();feedback.textContent='已清空材料，步驟紀錄保留。';render()};el.querySelector('.save-step').onclick=()=>{if(steps.length>=30){feedback.textContent='最多記錄30步。';return}steps.push(state.slice());el.querySelector('.step-log').innerHTML=steps.map(a=>'<li>'+['萬','千','百','十','個'].map((x,j)=>x+' '+a[j]+' 件').join('，')+'</li>').join('');feedback.textContent='已記錄目前材料。'};el.querySelector('.clear-steps').onclick=()=>{steps=[];el.querySelector('.step-log').innerHTML='';feedback.textContent='已清除步驟紀錄。'};render()});
