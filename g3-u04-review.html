<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第4單元減法審查稿</title><style>
body{font:16px/1.7 'Microsoft JhengHei',sans-serif;color:#202630;background:#f5f3ed;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea{font:inherit;padding:8px}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:5em}.grid{border-collapse:collapse;margin:.5em 0;max-width:100%;table-layout:fixed}.grid th,.grid td{border:1px solid #888;text-align:center;padding:3px}.grid th:first-child{width:5.8em}.grid input{box-sizing:border-box;width:2.7em;max-width:100%;padding:5px;text-align:center}.grid caption{text-align:left;font-weight:bold}summary{cursor:pointer;color:#184f70;min-height:42px;font-weight:bold}.cols{font:1.4em/1.4 monospace;display:grid;width:max-content;grid-template-columns:1.2em 4ch;text-align:right}.line{grid-column:1 / 3;border-top:1px solid}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,.hint,.status,.grid-section,article>label,article>p{display:none!important}.print-only{display:block}.key{break-before:page}article{break-inside:avoid;page-break-inside:avoid;border:0;padding:4mm 0}.paper-grid{border-collapse:collapse;margin:3mm 0}.paper-grid th,.paper-grid td{border:1px solid #000;width:13mm;height:8mm;text-align:center}.paper-grid th:first-child{width:24mm}.notes{height:20mm;border:1px solid #000}}
</style></head><body><main class="wrap"><h1>三年級第4單元：多次退位直式減法</h1><section class="controls"><strong>公開審查稿：12題來源候選，不是完整教材或精熟測驗。</strong><p>按鈕只檢查差；對位、退位、圈0、說明及實物操作由成人核對。畫線、圈選及實物活動請在紙上或使用實物完成；數位表格不代替真實積木。重新整理清除作答與提示紀錄，列印為空白卷；教育、手機及列印尚待確認。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">公開審查稿：12題來源候選，非完整教材或精熟。依題意填寫，由成人核對對位、退位、解釋及實物操作。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>差以外的對位、退位與操作仍請成人核對；進行真實積木時注意相鄰位值交換，數位填表不能證明實作能力。</p></section></main><script>
const items=[{"id":"PG01","facet":"algorithm","task":"place","prompt":"對7351－2864，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。","answer":"7351－2864＝4487；完整同位直式及逐位交換證據符合此算式","operands":[7351,2864],"difference":4487,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PA01","facet":"algorithm","task":"place","prompt":"對8534－4789，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。","answer":"8534－4789＝3745；完整同位直式及逐位交換證據符合此算式","operands":[8534,4789],"difference":3745,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PB01","facet":"algorithm","task":"place","prompt":"對7432－2856，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。把橫式、材料紀錄和直式對應的位用線連起。","answer":"7432－2856＝4576；完整同位直式及逐位交換證據符合此算式","operands":[7432,2856],"difference":4576,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PC01","facet":"algorithm","task":"place","prompt":"對7631－4867，先寫兩數的千百十個量，把每位對齊後列完整直式。用另一張空格表記同一問題，不整體左移第二個數。寫一句理由供另一位記錄員核對，不只抄結果。","answer":"7631－4867＝2764；完整同位直式及逐位交換證據符合此算式","operands":[7631,4867],"difference":2764,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PG03","facet":"zero","task":"zero","prompt":"計算7005－3689並留下每步進退位。把沒有材料的一位仍留在表中。圈出0所在的位，說它如何參與計算。","answer":"7005－3689＝3316；完整同位直式及逐位交換證據符合此算式","operands":[7005,3689],"difference":3316,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PA03","facet":"zero","task":"zero","prompt":"計算8002－3978並留下每步進退位。把沒有材料的一位仍留在表中。圈出0所在的位，說它如何參與計算。","answer":"8002－3978＝4024；完整同位直式及逐位交換證據符合此算式","operands":[8002,3978],"difference":4024,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PB03","facet":"zero","task":"zero","prompt":"計算9004－5687並留下每步進退位。把沒有材料的一位仍留在表中。把橫式、材料紀錄和直式對應的位用線連起。圈出0所在的位，說它如何參與計算。","answer":"9004－5687＝3317；完整同位直式及逐位交換證據符合此算式","operands":[9004,5687],"difference":3317,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PC03","facet":"zero","task":"zero","prompt":"計算6008－3979並留下每步進退位。把沒有材料的一位仍留在表中。寫一句理由供另一位記錄員核對，不只抄結果。圈出0所在的位，說它如何參與計算。","answer":"6008－3979＝2029；完整同位直式及逐位交換證據符合此算式","operands":[6008,3979],"difference":2029,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PG04","facet":"meaning","task":"context","prompt":"倉庫原有9430張卡，送出4876張。要更新庫存標籤。用9430－4876列直式求結果，寫單位並說每個數的角色。","answer":"9430－4876＝4554；完整同位直式及逐位交換證據符合此算式","operands":[9430,4876],"difference":4554,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PA04","facet":"meaning","task":"context","prompt":"倉庫原有7250張卡，送出3867張。要更新庫存標籤。用7250－3867列直式求結果，寫單位並說每個數的角色。","answer":"7250－3867＝3383；完整同位直式及逐位交換證據符合此算式","operands":[7250,3867],"difference":3383,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PB04","facet":"meaning","task":"context","prompt":"倉庫原有6340張卡，送出2876張。要更新庫存標籤。把橫式、材料紀錄和直式對應的位用線連起。用6340－2876列直式求結果，寫單位並說每個數的角色。","answer":"6340－2876＝3464；完整同位直式及逐位交換證據符合此算式","operands":[6340,2876],"difference":3464,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"},{"id":"PC04","facet":"meaning","task":"context","prompt":"倉庫原有8420張卡，送出3687張。要更新庫存標籤。寫一句理由供另一位記錄員核對，不只抄結果。用8420－3687列直式求結果，寫單位並說每個數的角色。","answer":"8420－3687＝4733；完整同位直式及逐位交換證據符合此算式","operands":[8420,3687],"difference":4733,"curriculum_codes":["N-3-2"],"manual_required":true,"education_review":"pending"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(i,n,paper=false){const cols=['千','百','十','個'],rows=['退位記錄','被減數','減數','結果'];return '<table class="'+(paper?'paper-grid':'grid')+'"><caption>第'+(i+1)+'題第'+n+'張空白位值表</caption><thead><tr><th scope="col">記錄</th>'+cols.map(c=>'<th scope="col">'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th scope="row">'+r+'</th>'+cols.map(c=>'<td>'+(paper?'':'<input type="text" inputmode="numeric" maxlength="2" aria-label="第'+(i+1)+'題第'+n+'張表'+r+c+'位">')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function guide(q){if(q.facet==='meaning')return q.operands[0]+'張是原有卡片；'+q.operands[1]+'張是送出的卡片；'+q.difference+'張是剩下的卡片。';if(q.facet==='zero'){const names=['個','十','百','千'],z=[];q.operands.forEach(n=>String(n).split('').reverse().forEach((d,i)=>{if(d==='0')z.push(n+'的'+names[i]+'位是0')}));return z.join('；')+'。跨零交換須核對每次相鄰位值的變化。'}return ''}
document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<details class="hint"><summary>查看對齊提示</summary><div class="cols"><span></span><span>'+q.operands[0]+'</span><span>−</span><span>'+q.operands[1]+'</span><span class="line"></span></div></details><p class="status">對齊提示：本次尚未開啟</p><label>填寫差 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的差"></label><button type="button">檢查差</button><p class="feedback" role="status"></p><details class="grid-section"><summary>展開空白位值表</summary><p>依題意填寫，退位記錄及作答需成人確認。</p>'+table(i,1)+(i<4?table(i,2):'')+'</details><div class="print-only">'+table(i,1,true)+(i<4?table(i,2,true):'')+'<div>直式、退位與說明：</div><div class="notes"></div></div><label>記錄直式、退位及說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><p>直式、退位、圈0、理由與題目要求的材料操作由成人核對。</p></article>').join('');
document.querySelectorAll('article').forEach((el,i)=>{const hint=el.querySelector('.hint'),input=el.querySelector('input'),feedback=el.querySelector('.feedback');hint.ontoggle=()=>{if(hint.open)el.querySelector('.status').textContent='對齊提示：本次已開啟（收合後仍保留紀錄）'};input.oninput=()=>{feedback.textContent=''};el.querySelector('button').onclick=()=>{const s=input.value.trim();feedback.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].difference?'差正確；其他要求仍請成人核對。':'差需要再檢查；請檢視每一位。'}});
document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+(guide(q)?'<br>'+esc(guide(q)):'')+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
