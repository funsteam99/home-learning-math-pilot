<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第11單元連乘概念審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:7em}.feedback{font-weight:bold}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.notes{height:45mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第11單元：兩步驟連乘</h1><section class="controls"><strong>公開審查稿：2題原來源概念任務，為同類結構，非完整教材或精熟。</strong><p>先畫量角色圖，再把兩步算式分開寫並說明單位與順序，不使用併式。網頁只檢查兩個數量；算式、單位、圖形與解釋須由成人核對。原題允許成人示範角色圖，請記錄協助，不能視為獨立作答。重新整理清除作答；列印為空白卷，教育、手機與列印待驗證。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">公開來源概念審查稿，非完整教材或精熟。兩步分開列式，成人核對角色圖、單位、順序與說明。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>數量正確，仍須核對兩步分開列式、中間量、單位、角色圖及協助。</p></section></main><script>
const items=[{"id":"P01","facet":"successive","source_task":"概念","role":"來源概念任務，供教學審查，非精熟","prompt":"每箱3袋，每袋4枚，有2箱，要找總枚數。先畫兩步資料流，每步寫一個分開算式與單位，最後說先後順序。成人可先示範量角色圖，孩子再說每個數代表的量。","answer":"每箱3×4＝12枚；共12×2＝24枚","parameters":{"pattern":"mul-mul","a":3,"b":4,"c":2,"result":24,"semantic_route":"概念"},"first_result":12,"final_result":24,"curriculum_codes":["N-3-7"],"manual_required":true,"education_review":"pending"},{"id":"P04","facet":"order","source_task":"概念","role":"來源概念任務，供教學審查，非精熟","prompt":"有5箱，每箱6盒，每盒6枝筆。交接員先要每箱枝數，再要全部枝數。先畫兩步資料流，每步寫一個分開算式與單位，最後說先後順序。成人可先示範量角色圖，孩子再說每個數代表的量。","answer":"每箱6×6＝36枝；全部36×5＝180枝；第一步每箱量供第二步使用","parameters":{"pattern":"mul-mul","a":6,"b":6,"c":5,"result":180,"semantic_route":"概念"},"first_result":36,"final_result":180,"curriculum_codes":["N-3-7"],"manual_required":true,"education_review":"pending"}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>第一步：每箱的數量 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題每箱數量"></label><label>第二步：全部數量 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題全部數量"></label><button type="button">檢查數量</button><p class="feedback" role="status"></p><div class="print-only"><div>量角色圖、兩個算式與說明：</div><div class="notes"></div></div><label>記錄量角色圖、兩個算式、單位與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範角色圖</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>兩步算式、單位、圖形及理由由成人核對；協助紀錄只保留本頁，不能單憑選項判定獨立。</p></article>').join('');document.querySelectorAll('article').forEach((el,i)=>{const fields=[...el.querySelectorAll('input')],f=el.querySelector('.feedback');fields.forEach(x=>x.oninput=()=>{f.textContent=''});el.querySelector('button').onclick=()=>{let v=fields.map(x=>x.value.trim());f.textContent=v.some(x=>!/^\d+$/.test(x))?'請填入兩個數字後再檢查。':Number(v[0])===items[i].first_result&&Number(v[1])===items[i].final_result?'兩個數量正確；算式、單位、圖形與說明仍請成人核對。':'數量需要再檢查；請重看每箱與全部的關係。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.answer)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
