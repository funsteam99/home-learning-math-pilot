<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年級第6單元含零對比審查稿</title><style>body{font:16px/1.7 'Microsoft JhengHei',sans-serif;background:#f5f3ed;color:#202630;margin:0;padding:16px}.wrap{max-width:850px;margin:auto}section,article{background:white;border:1px solid #d5d0c5;border-radius:9px;padding:16px;margin:12px 0}button,input,textarea,select{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{min-height:42px}label{display:block;margin-top:8px}textarea{display:block;width:95%;min-height:5em}summary{cursor:pointer;color:#184f70;font-weight:bold;min-height:42px}.grid{border-collapse:collapse;margin:8px 0;table-layout:fixed;max-width:100%}.grid th,.grid td{border:1px solid #888;padding:3px;text-align:center}.grid th:first-child{width:5.8em}.grid input{width:2.7em;max-width:100%;padding:5px;text-align:center}.feedback{font-weight:bold}.digit-mark{margin:8px 0}.digit-mark button{min-width:42px;margin-right:4px}.digit-mark button[aria-pressed="true"]{border:2px solid #184f70;border-radius:50%;background:#e4f2f8}.print-only{display:none}[hidden]{display:none!important}@media print{button,.controls,.feedback,.grid-section,.digit-mark,article>label,article>p{display:none!important}.print-only{display:block}article{break-inside:avoid;page-break-inside:avoid;border:0}.key{break-before:page}.paper{border-collapse:collapse;margin:3mm 0}.paper th,.paper td{border:1px solid #000;width:13mm;height:8mm;text-align:center}.paper th:first-child{width:24mm}.notes{height:30mm;border:1px solid #000}}</style></head><body><main class="wrap"><h1>三年級第6單元：含零乘法對比</h1><section class="controls"><strong>公開審查稿：2題本專案新寫候選，並非原教材原題，尚未教育審查；非完整單元或精熟。</strong><p>依題意在網頁圈記或紙上圈0並列直式。按鈕僅檢查積，位值、進位、說明與實物操作由成人核對。成人記錄協助情況；紀錄只在本頁，重新整理清除，不能單憑選項判斷獨立。列印為空白卷；手機與列印待驗證。</p><label><input id="showKey" type="checkbox">顯示家長答案頁</label></section><p class="print-only">本專案新寫的2題公開審查候選，未經教育審查；請在紙上圈0並由成人核對直式及說明。</p><div id="questions"></div><section id="key" class="key" hidden><h2>家長參考答案</h2><p>請另核對孩子的直式、說明與協助情況。</p></section></main><script>
const items=[{"id":"G3U06-ZC01","purpose":"十位為0且個位乘積沒有進位","prompt":"計算204×2。在紙上圈出被乘數的0，列一列直式。說明個位有沒有進位、結果的十位為什麼要保留。","operands":[204,2],"product":408,"parent_answer":"204×2＝408。個位4×2＝8，沒有進位；十位0×2＝0，十位仍需保留0；百位2×2＝4。","manual_required":true},{"id":"G3U06-ZC02","purpose":"個位為0且十位乘積向百位進位","prompt":"計算230×4。在紙上圈出被乘數的0，列一列直式。說明個位的結果，以及十位計算時是否要向百位進位。","operands":[230,4],"product":920,"parent_answer":"230×4＝920。個位0×4＝0；十位3×4＝12，十位寫2並向百位進1；百位2×4加進位1等於9。","manual_required":true}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function grid(i,paper=false){const places=['千','百','十','個'],rows=['進位記錄','被乘數','結果'];return '<table class="'+(paper?'paper':'grid')+'"><caption>第'+(i+1)+'題空白位值表</caption><thead><tr><th scope="col">記錄</th>'+places.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><th scope="row">'+r+'</th>'+places.map(c=>'<td>'+(paper?'':'<input type="text" inputmode="numeric" maxlength="2" aria-label="第'+(i+1)+'題'+r+c+'位">')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
document.querySelector('#questions').innerHTML=items.map((q,i)=>'<article><strong>'+(i+1)+'. </strong>'+esc(q.prompt)+'<label>填寫積 <input type="text" inputmode="numeric" aria-label="第'+(i+1)+'題的積"></label><button type="button">檢查積</button><p class="feedback" role="status"></p><div class="digit-mark">圈記被乘數中的數字（成人核對）： '+String(q.operands[0]).split('').map((d,j)=>'<button type="button" class="digit" aria-pressed="false" aria-label="第'+(i+1)+'題被乘數第'+(j+1)+'個數字'+d+'">'+d+'</button>').join('')+'</div><details class="grid-section"><summary>展開空白位值表</summary><p>位值與進位需成人核對。</p>'+grid(i)+'</details><div class="print-only">'+grid(i,true)+'<div>一列直式與說明：</div><div class="notes"></div></div><label>記錄直式與說明<textarea aria-label="第'+(i+1)+'題記錄"></textarea></label><label>成人記錄本題協助情況 <select aria-label="第'+(i+1)+'題成人記錄協助情況"><option value="">尚未記錄</option><option>成人示範</option><option>其他協助</option><option>成人記錄未提供協助</option></select></label><p>位值、直式和說明需成人核對。</p></article>').join('');document.querySelectorAll('article').forEach((el,i)=>{const input=el.querySelector('input'),f=el.querySelector('.feedback');input.oninput=()=>{f.textContent=''};el.querySelectorAll('.digit').forEach(b=>{b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')});el.querySelector('button').onclick=()=>{const s=input.value.trim();f.textContent=!/^\d+$/.test(s)?'請填入數字後再檢查。':Number(s)===items[i].product?'積正確；其他要求仍請成人核對。':'積需要再檢查；請檢視每一位。'}});document.querySelector('#key').innerHTML+='<ol>'+items.map(q=>'<li>'+esc(q.parent_answer)+'</li>').join('')+'</ol>';document.querySelector('#showKey').onchange=e=>document.querySelector('#key').hidden=!e.target.checked;
</script></body></html>
