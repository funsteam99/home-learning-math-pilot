<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四至六年級數學試用審查</title><style>
/* Layout: controls on top; each practice sheet is a paper-like card of two question columns.
   Palette: warm paper neutrals with one deep-blue accent; red reserved for answers. */
:root {
  --bg: #f4f2ec;
  --fg: #1c2330;
  --muted: #5f6772;
  --card: #ffffff;
  --line: #d6d0c2;
  --accent: #2d5b86;
  --on-accent: #ffffff;
  --ans: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
    --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --fg: #e7e4dc; --muted: #9ba4af; --card: #1c212a;
  --line: #3b434f; --accent: #8db8e0; --on-accent: #10151c; --ans: #ff9b8f;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; min-width: 0; }
h1 { font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 12px;
}
.row[hidden] { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
label { font-size: 14px; color: var(--muted); }
select, input[type="number"] {
  font: inherit;
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  min-width: 0;
}
select { flex: 1 1 220px; max-width: 100%; }
input[type="number"] { width: 150px; max-width: 100%; }
.btn {
  font: inherit;
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--fg); font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

.page {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-top: 16px;
}
.page-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
  font-size: 13px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.page-head h2 { grid-column: 1 / -1; margin: 0 0 2px; }
.fill { display: inline-block; min-width: 4em; border-bottom: 1px solid var(--line); }
.page-foot {
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-flow: column;
  grid-template-rows: repeat(var(--rows), auto);
  column-gap: 22px;
  row-gap: 2px;
}
.q { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; font-size: 16px; }
.no { width: 2.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.pt { min-width: 0; overflow-wrap: anywhere; }
.blank { flex: 1 1 36px; min-width: 36px; border-bottom: 1px solid var(--line); height: 1.2em; }
.ans { display: none; color: var(--ans); font-weight: 700; flex: none; }
.show-ans .ans { display: inline; }
.pic .q { min-height: 84px; }
.pic svg { flex: none; width: 96px; height: 80px; color: var(--fg); }

.key {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 4px 12px;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.mastery ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.mastery li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 16px; }
.mastery li .q { min-height: 0; }
.mastery input {
  font: inherit;
  width: 96px;
  min-height: 40px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}
.fix { color: var(--ans); font-weight: 700; display: none; }
.mastery li.wrong .fix { display: inline; }
.result { font-weight: 700; font-size: 16px; }

@media (max-width: 480px) {
  .page-head { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
}

@media print {
  :root:root {
    --bg: #ffffff; --fg: #000000; --muted: #333333; --card: #ffffff;
    --line: #777777; --accent: #000000; --on-accent: #ffffff; --ans: #000000;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  body { padding: 0; background: #ffffff; color: #000000; }
  .wrap > h1, .lede, .panel, .mastery, .note { display: none !important; }
  .page { border: 0; border-radius: 0; margin: 0; padding: 0; break-after: page; }
  .page:last-of-type { break-after: auto; }
  .page-head { margin-bottom: 6px; padding-bottom: 6px; }
  .grid { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); row-gap: 0; }
  .text .q { height: 5.9mm; min-height: 0; font-size: 12pt; }
  .pic .q { height: 25mm; min-height: 0; font-size: 12pt; }
  .pic svg { width: 26mm; height: 22mm; }
  .page-foot { font-size: 9pt; }
  .answers { break-before: page; }
  .answers[hidden] { display: block !important; }
  .show-ans .ans { display: inline !important; }
}

m;flex:none}.duration-bar{display:inline-block;height:12px;background:var(--accent);vertical-align:middle}.dot.square{border-radius:0}.dot.crossed{position:relative}.dot.crossed:after{content:"×";position:absolute;font-size:27px;line-height:18px;color:var(--ans);left:1px;top:0}[hidden]{display:none!important}.question-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.item{border-bottom:1px solid var(--line);padding:10px 0;min-width:0}.item p{margin:5px 0}.item input[type=number]{width:75px;min-height:40px}.dots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.dot{width:18px;height:18px;border-radius:50%;background:var(--fg);display:inline-block}.options{display:flex;gap:6px;flex-wrap:wrap}.smallbtn{font:inherit;min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}.smallbtn.selected{background:var(--accent);color:var(--on-accent)}.drawbtn{border-radius:50%;padding:0;width:40px}.feedback{color:var(--ans);font-weight:bold}.pair{display:flex;align-items:center;gap:6px;margin:4px 0}.pair select{flex:0 1 95px;min-height:38px}.resultbox{padding:12px;background:var(--bg);border-radius:6px}.mastery input[type=radio],.mastery input[type=checkbox]{width:18px;min-height:0;height:18px}.mastery fieldset{border:0;padding:0}.mastery label{color:var(--fg)}.item label{color:var(--fg)}.page-head{display:block}.note{line-height:1.6}@media(max-width:600px){.question-list{grid-template-columns:1fr}}@media print{.question-list{grid-template-columns:1fr 1fr}.panel.mastery{display:none!important}}
.practice-frame{display:block;width:100%;border:0;margin-top:16px;min-height:500px}.direct{margin-top:8px}@media print{.panel,.lede,.direct{display:none}}</style></head><body><div class="wrap"><h1>數學自動學習系統</h1><p class="lede"><a href="./">回一年級</a>　｜　<a href="g2-learning-u01-u04-v1.html">二年級</a>　｜　<a href="g3-trial.html">三年級</a>　｜　四至六年級試用審查</p><section class="panel"><div class="row"><label for="unit">選擇年級與候選題</label><select id="unit"><option value="g4-u01-a-review.html">四年級第1單元 A包：位值讀寫</option><option value="g4-u01-b-review.html">四年級第1單元 B包：位名與數量</option><option value="g4-u01-c-review.html">四年級第1單元 C包：萬與個合寫</option><option value="g4-u01-d-review.html">四年級第1單元 D包：精確整數萬</option><option value="g4-u01-g-review.html">四年級第1單元 G包：大數比較</option><option value="g5-u01-a-review.html">五年級第1單元 A包：大數分段</option><option value="g5-u01-b-review.html">五年級第1單元 B包：小數位值</option><option value="g5-u01-c-review.html">五年級第1單元 C包：相鄰位值</option><option value="g5-u01-d-review.html">五年級第1單元 D包：跨兩位位值</option><option value="g6-u01-a-review.html">六年級第1單元 A包：因數與排列</option><option value="g6-u01-b-review.html">六年級第1單元 B包：排列圖與因數</option><option value="g6-u01-c-review.html">六年級第1單元 C包：列因數</option><option value="g6-u01-d-review.html">六年級第1單元 D包：質合數分類</option></select></div><p class="note"><strong>試用／審查中：</strong>各頁僅15題候選，並非完整單元或精熟測驗。教育專業、實際列印和兒童試作尚未完成；請成人陪同確認口讀、方法與實物操作。切換頁面或重新整理會清除作答。</p></section><p class="note direct"><a id="direct" href="g4-u01-a-review.html">開啟單元獨立頁（列印或另開使用）</a></p><iframe class="practice-frame" id="practice" title="四至六年級候選練習" src="g4-u01-a-review.html"></iframe></div><script>const unit=document.querySelector('#unit'),frame=document.querySelector('#practice'),direct=document.querySelector('#direct');let observer;function update(){direct.href=unit.value;frame.src=unit.value}unit.addEventListener('change',update);frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||!d.body)return;const style=d.createElement('style');style.textContent='body{background:#f4f2ec;color:#1c2330;font:15px/1.6 "Microsoft JhengHei",sans-serif;margin:0;padding:0}main{max-width:none;margin:0}h1{font-size:17px}section,article{background:#fff;border:1px solid #d6d0c2;border-radius:6px;padding:16px 18px;margin:0 0 16px}button,input,textarea,select{font:inherit}button{min-height:44px;border:1px solid #2d5b86;border-radius:8px;background:#2d5b86;color:#fff;padding:8px 16px}input,textarea,select{max-width:100%;box-sizing:border-box}';d.head.appendChild(style);const resize=()=>{frame.style.height=Math.max(500,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'};if(observer)observer.disconnect();observer=new ResizeObserver(resize);observer.observe(d.body);resize()}catch(e){frame.style.height='800px'}});update();</script></body></html>
